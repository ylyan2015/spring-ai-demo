# H2 数据库配置（备份/开发模式）

spring:
  datasource:
    # 使用文件持久化模式，数据存储在 ./data/chatdb.mv.db
    url: jdbc:h2:file:./data/chatdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  
  # H2 Console 默认关闭：sa 空密码 + console 暴露 = 未授权 RCE（release 审查 C3）
  # 本地调试确需时手动改为 true，切勿在生产开启
  h2:
    console:
      enabled: false
      path: /h2-console
