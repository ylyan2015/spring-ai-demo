# DeepSeek 模型配置（使用OpenAI兼容API）

spring:
  ai:
    deepseek:
      # DeepSeek API地址（注意：不要包含 /v1，Spring AI 会自动添加）
      base-url: https://api.deepseek.com
      # 真实 Key 一律经环境变量 DEEPSEEK_API_KEY 注入（本文件 git 跟踪，禁止写入真实 Key）
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          # 官方现行两档：deepseek-flash（V4.1-Flash，快/便宜）/ deepseek-v4-pro（旗舰高精度）；
          # 两者思考模式均默认开启（无需额外参数）。脚本生成分档覆盖见 video.script.model
          model: deepseek-flash
