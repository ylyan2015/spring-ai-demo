<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时区测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 16px;
            border: 1px solid #2a2a2a;
            min-width: 420px;
        }
        h2 { margin-bottom: 24px; color: #b0b0b0; font-size: 14px; font-weight: 400; }
        .clock-time {
            font-size: 48px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .clock-date {
            font-size: 18px;
            color: #b0b0b0;
            margin-top: 8px;
        }
        .info {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
            font-size: 13px;
            color: #666;
            line-height: 1.8;
        }
        .info span { color: #4f46e5; }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status.ok { background: #064e3b; color: #34d399; }
        .status.fail { background: #7f1d1d; color: #fca5a5; }
        .status.loading { background: #1e3a5f; color: #93c5fd; }
    </style>
</head>
<body>
    <div class="container">
        <h2>IP 时区检测 + Intl 实时时钟</h2>
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">加载中...</div>
        <div class="info">
            <div>检测到的时区：<span id="tzValue">--</span></div>
            <div>客户端 IP：<span id="ipValue">--</span></div>
            <div>数据来源：<span id="sourceValue">--</span></div>
            <div>API 状态：<span id="apiStatus" class="status loading">请求中</span></div>
        </div>
    </div>

    <script>
        let timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        let source = '浏览器默认';

        // 方案1：调用后端 API（后端通过 ipinfo.io 获取时区）
        async function fetchTimezoneFromBackend() {
            try {
                const resp = await fetch('/api/timezone');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.success && data.timezone) {
                        timezone = data.timezone;
                        source = 'ipinfo.io (后端)';
                        document.getElementById('tzValue').textContent = data.timezone;
                        document.getElementById('ipValue').textContent = data.ip || '--';
                        document.getElementById('sourceValue').textContent = source;
                        document.getElementById('apiStatus').textContent = '成功';
                        document.getElementById('apiStatus').className = 'status ok';
                        return;
                    }
                }
                throw new Error('HTTP ' + resp.status);
            } catch (e) {
                console.warn('后端 API 失败:', e);
                document.getElementById('apiStatus').textContent = '失败 (' + e.message + ')';
                document.getElementById('apiStatus').className = 'status fail';
            }
        }

        // 方案2：前端直接调用 ipinfo.io（如果后端不可用时的 fallback）
        async function fetchTimezoneDirect() {
            try {
                const resp = await fetch('https://ipinfo.io/json');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.timezone) {
                        timezone = data.timezone;
                        source = 'ipinfo.io (前端直调)';
                        document.getElementById('tzValue').textContent = data.timezone;
                        document.getElementById('ipValue').textContent = data.ip || '--';
                        document.getElementById('sourceValue').textContent = source;
                        return;
                    }
                }
            } catch (e) {
                console.warn('前端直调 ipinfo.io 也失败，使用浏览器时区:', e);
            }
        }

        // 更新时钟
        function updateClock() {
            const now = new Date();

            const timeStr = new Intl.DateTimeFormat('zh-CN', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).format(now);

            const dateStr = new Intl.DateTimeFormat('zh-CN', {
                timeZone: timezone,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'long'
            }).format(now);

            document.getElementById('clockTime').textContent = timeStr;
            document.getElementById('clockDate').textContent = dateStr;
        }

        // 初始化
        async function init() {
            // 先显示浏览器默认时区
            document.getElementById('tzValue').textContent = timezone;
            document.getElementById('sourceValue').textContent = source;
            updateClock();
            setInterval(updateClock, 1000);

            // 尝试后端 API
            await fetchTimezoneFromBackend();

            // 如果后端失败，尝试前端直调
            if (source === '浏览器默认') {
                await fetchTimezoneDirect();
            }

            // 更新显示
            document.getElementById('tzValue').textContent = timezone;
            document.getElementById('sourceValue').textContent = source;
        }

        init();
    </script>
</body>
</html>
