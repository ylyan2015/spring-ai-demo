<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 短视频工作室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px 32px; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 24px; font-weight: 600; color: #fff; }
        .header p { font-size: 14px; color: #888; margin-top: 4px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }
        .input-section { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #2a2a3e; }
        .input-section label { display: block; font-size: 14px; font-weight: 500; color: #aaa; margin-bottom: 8px; }
        .input-row { display: flex; gap: 12px; }
        .input-row textarea { flex: 1; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; resize: vertical; min-height: 60px; font-family: inherit; }
        .input-row textarea:focus { outline: none; border-color: #4a6cf7; }
        .input-row textarea::placeholder { color: #555; }
        .btn { background: #4a6cf7; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .btn:hover { background: #3a5ce7; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-green { background: #2ecc71; } .btn-green:hover { background: #27ae60; } .btn-green:disabled { background: #333; color: #666; }
        .btn-orange { background: #e67e22; } .btn-orange:hover { background: #d35400; }
        .action-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
        .action-bar .info { font-size: 13px; color: #888; margin-left: auto; }
        .status { text-align: center; padding: 40px; color: #888; font-size: 15px; }
        .status.loading { color: #4a6cf7; } .status.error { color: #f74a4a; }
        .progress-bar { background: #1a1a2e; border-radius: 8px; padding: 16px 24px; margin-bottom: 24px; border: 1px solid #2a2a3e; display: none; }
        .progress-bar.visible { display: block; }
        .progress-bar .label { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .progress-bar .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-bar .bar-fill { height: 100%; background: #4a6cf7; border-radius: 3px; transition: width 0.3s; width: 0%; }
        .progress-bar .bar-fill.indeterminate { width: 30%; animation: indeterminate 1.5s infinite ease-in-out; }
        @keyframes indeterminate { 0%{margin-left:0} 50%{margin-left:70%} 100%{margin-left:0} }
        .storyboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .storyboard-header h2 { font-size: 20px; color: #fff; }
        .storyboard-header .meta { font-size: 13px; color: #888; }
        .shots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .shot-card { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a3e; overflow: hidden; transition: border-color 0.2s; }
        .shot-card:hover { border-color: #4a6cf7; } .shot-card.has-image { border-color: #2ecc71; }
        .shot-image { width: 100%; aspect-ratio: 16/9; background: #111; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .shot-image img { width: 100%; height: 100%; object-fit: cover; }
        .shot-image .placeholder { color: #444; font-size: 14px; }
        .shot-image .loading-spinner { color: #4a6cf7; font-size: 14px; }
        .shot-body { padding: 16px; }
        .shot-number { display: inline-block; background: #4a6cf7; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
        .shot-duration { display: inline-block; background: #2a2a3e; color: #aaa; font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
        .shot-scene { font-size: 14px; color: #ccc; margin-bottom: 8px; line-height: 1.5; }
        .shot-narration { font-size: 13px; color: #888; font-style: italic; margin-bottom: 8px; padding: 8px; background: #0f0f1a; border-radius: 6px; }
        .shot-camera { font-size: 12px; color: #666; margin-bottom: 12px; }
        .shot-prompt { font-size: 12px; color: #555; word-break: break-all; padding: 8px; background: #0a0a15; border-radius: 4px; margin-bottom: 12px; }
        .shot-prompt strong { color: #777; }
        .shot-actions { margin-top: 8px; }
        .video-result { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a3e; padding: 24px; margin-top: 24px; text-align: center; }
        .video-result h3 { color: #fff; margin-bottom: 16px; font-size: 18px; }
        .video-result video { max-width: 100%; border-radius: 8px; background: #000; }
        .video-result .download-link { display: inline-block; margin-top: 12px; color: #4a6cf7; font-size: 14px; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI 短视频工作室</h1>
        <p>输入创意 → 生成分镜脚本 → 生成画面 → 合成视频</p>
    </div>
    <div class="container">
        <div class="input-section">
            <label>创意想法</label>
            <div class="input-row">
                <textarea id="ideaInput" placeholder="描述你的短视频创意，例如：一个关于猫咪日常生活的温馨短片..." rows="2"></textarea>
                <button class="btn" id="generateBtn" onclick="generateScript()">生成分镜</button>
            </div>
        </div>
        <div class="progress-bar" id="progressBar">
            <div class="label" id="progressLabel">处理中...</div>
            <div class="bar"><div class="bar-fill indeterminate" id="progressFill"></div></div>
        </div>
        <div id="resultArea"><div class="status">输入创意想法，点击“生成分镜”开始</div></div>
    </div>
<script>
let currentStoryboard = null;
let shotImages = [];

async function generateScript() {
    const idea = document.getElementById('ideaInput').value.trim();
    if (!idea) return;
    const btn = document.getElementById('generateBtn');
    btn.disabled = true; btn.textContent = '生成中...';
    showProgress('正在生成分镜脚本，请稍候（约 15-30 秒）...');
    try {
        const resp = await fetch('/api/video/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idea }) });
        const data = await resp.json();
        if (!data.success) { showStatus(data.message || '生成失败', 'error'); return; }
        currentStoryboard = data.storyboard;
        shotImages = new Array(data.storyboard.shots.length).fill(null);
        if (data.firstImage) shotImages[0] = data.firstImage;
        renderStoryboard(data.storyboard);
    } catch (e) { showStatus('请求失败: ' + e.message, 'error'); }
    finally { btn.disabled = false; btn.textContent = '生成分镜'; hideProgress(); }
}

function showStatus(msg, type) { document.getElementById('resultArea').innerHTML = '<div class="status ' + (type||'') + '">' + msg + '</div>'; }
function showProgress(label) { document.getElementById('progressBar').classList.add('visible'); document.getElementById('progressLabel').textContent = label; }
function hideProgress() { document.getElementById('progressBar').classList.remove('visible'); }
function allDone() { return shotImages.length > 0 && shotImages.every(function(i) { return i !== null && i.imageUrl; }); }

function renderStoryboard(sb) {
    var td = sb.shots.reduce(function(s, x) { return s + x.durationSeconds; }, 0);
    var h = '<div class="storyboard-header"><h2>' + esc(sb.title) + '</h2><span class="meta">' + esc(sb.theme) + ' | ' + sb.shots.length + ' 个镜头 | 总时长 ' + td + 's</span></div>';
    h += '<div class="action-bar"><button class="btn btn-orange btn-sm" onclick="generateAllImages()" id="genAllBtn"' + (allDone() ? ' disabled' : '') + '>一键生成所有图片</button>';
    h += '<button class="btn btn-green" onclick="composeVideo()" id="composeBtn"' + (allDone() ? '' : ' disabled') + '>合成视频</button>';
    h += '<span class="info" id="imageCountInfo">已生成: ' + shotImages.filter(function(i){return i!==null;}).length + '/' + sb.shots.length + ' 张图片</span></div>';
    h += '<div class="shots-grid">';
    sb.shots.forEach(function(shot, i) {
        var hasImg = shotImages[i] !== null;
        var imgH = hasImg ? '<img src="' + shotImages[i].imageUrl + '" alt="Shot ' + shot.order + '">' : '<span class="placeholder">点击生成图片</span>';
        h += '<div class="shot-card ' + (hasImg ? 'has-image' : '') + '" id="shot-' + i + '"><div class="shot-image" id="shot-image-' + i + '">' + imgH + '</div>';
        h += '<div class="shot-body"><span class="shot-number">镜头 ' + shot.order + '</span><span class="shot-duration">' + shot.durationSeconds + 's</span>';
        h += '<div class="shot-scene">' + esc(shot.sceneDescription) + '</div>';
        h += '<div class="shot-narration">' + esc(shot.narration) + '</div>';
        h += '<div class="shot-camera">镜头运动: ' + esc(shot.cameraMovement) + '</div>';
        h += '<div class="shot-prompt"><strong>Image Prompt: </strong>' + esc(shot.imagePrompt) + '</div>';
        h += '<div class="shot-actions" id="shot-actions-' + i + '">' + (hasImg ? '<span style="color:#2ecc71;font-size:13px">✓ 图片已生成</span>' : '<button class="btn btn-sm" onclick="generateShotImage(' + i + ')">生成此镜头图片</button>') + '</div>';
        h += '</div></div>';
    });
    h += '</div><div id="videoResultArea"></div>';
    document.getElementById('resultArea').innerHTML = h;
}

async function generateShotImage(index) {
    var shot = currentStoryboard.shots[index];
    var d = document.getElementById('shot-image-' + index);
    d.innerHTML = '<span class="loading-spinner">生成中...</span>';
    try {
        var r = await fetch('/api/video/generate-image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imagePrompt: shot.imagePrompt }) });
        var data = await r.json();
        if (data.success) { shotImages[index] = data.data; d.innerHTML = '<img src="' + data.data.imageUrl + '">'; document.getElementById('shot-'+index).classList.add('has-image'); document.getElementById('shot-actions-'+index).innerHTML = '<span style="color:#2ecc71;font-size:13px">✓ 图片已生成</span>'; updateActionBar(); }
        else { d.innerHTML = '<span class="placeholder" style="color:#f74a4a">' + (data.message||'失败') + '</span>'; }
    } catch (e) { d.innerHTML = '<span class="placeholder" style="color:#f74a4a">请求失败: ' + e.message + '</span>'; }
}

async function generateAllImages() {
    document.getElementById('genAllBtn').disabled = true;
    showProgress('正在批量生成所有镜头图片，请稍候（约 1-3 分钟）...');
    try {
        var r = await fetch('/api/video/generate-all-images', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentStoryboard) });
        var data = await r.json();
        if (data.success) { data.images.forEach(function(img, i) { if (img) { shotImages[i] = img; var d = document.getElementById('shot-image-'+i); if(d) d.innerHTML = '<img src="'+img.imageUrl+'">'; var c = document.getElementById('shot-'+i); if(c) c.classList.add('has-image'); var a = document.getElementById('shot-actions-'+i); if(a) a.innerHTML = '<span style="color:#2ecc71;font-size:13px">✓ 图片已生成</span>'; } }); updateActionBar(); }
        else { showStatus(data.message || '批量生成失败', 'error'); }
    } catch (e) { showStatus('请求失败: ' + e.message, 'error'); }
    finally { document.getElementById('genAllBtn').disabled = allDone(); hideProgress(); }
}

async function composeVideo() {
    if (!allDone()) { showStatus('请先生成所有镜头的图片', 'error'); return; }
    document.getElementById('composeBtn').disabled = true;
    showProgress('正在合成视频，这个过程可能需要 1-5 分钟...');
    var shots = currentStoryboard.shots.map(function(shot, i) { return { imageUrl: shotImages[i].imageUrl, durationSeconds: shot.durationSeconds, narration: shot.narration, imagePrompt: shot.imagePrompt }; });
    try {
        var r = await fetch('/api/video/compose', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ shots: shots }) });
        var data = await r.json();
        if (data.success) { renderVideoResult(data.video); } else { showStatus(data.message || '视频合成失败', 'error'); }
    } catch (e) { showStatus('请求失败: ' + e.message, 'error'); }
    finally { document.getElementById('composeBtn').disabled = false; hideProgress(); }
}

function renderVideoResult(video) {
    var a = document.getElementById('videoResultArea'); if (!a) return;
    a.innerHTML = '<div class="video-result"><h3>视频合成完成</h3><video controls autoplay src="' + video.videoUrl + '" style="max-width:100%;border-radius:8px;background:#000;">您的浏览器不支持视频播放</video><br><a class="download-link" href="' + video.videoUrl + '" download>下载视频</a><div style="margin-top:8px;font-size:13px;color:#888;">' + video.width + 'x' + video.height + ' | ' + video.totalDuration + 's' + (video.hasAudio ? ' | 含旁白配音' : '') + '</div></div>';
}

function updateActionBar() {
    var info = document.getElementById('imageCountInfo');
    if (info) info.textContent = '已生成: ' + shotImages.filter(function(i){return i!==null;}).length + '/' + currentStoryboard.shots.length + ' 张图片';
    var g = document.getElementById('genAllBtn'); if (g) g.disabled = allDone();
    var c = document.getElementById('composeBtn'); if (c) c.disabled = !allDone();
}

function esc(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
document.getElementById('ideaInput').addEventListener('keydown', function(e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateScript(); });
</script>
</body>
</html>
