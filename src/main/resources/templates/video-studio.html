<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 短视频工作室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px 32px; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 24px; font-weight: 600; color: #fff; }
        .header p { font-size: 14px; color: #888; margin-top: 4px; }
        .container { max-width: 1280px; margin: 0 auto; padding: 32px; }

        /* ===== 脚本管理栏 ===== */
        .script-bar { display: flex; gap: 12px; align-items: center; background: #1a1a2e; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; border: 1px solid #2a2a3e; flex-wrap: wrap; }
        .script-bar select { background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; border-radius: 8px; padding: 8px 12px; font-size: 14px; max-width: 320px; }
        .script-bar select:focus { outline: none; border-color: #4a6cf7; }
        .script-bar .divider { width: 1px; height: 24px; background: #2a2a3e; }
        .script-bar .bar-label { font-size: 13px; color: #888; }

        /* ===== 创意输入 ===== */
        .input-section { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #2a2a3e; }
        .input-section label { display: block; font-size: 14px; font-weight: 500; color: #aaa; margin-bottom: 8px; }
        .input-row { display: flex; gap: 12px; }
        .input-row textarea { flex: 1; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; resize: vertical; min-height: 60px; font-family: inherit; }
        .input-row textarea:focus { outline: none; border-color: #4a6cf7; }
        .input-row textarea::placeholder { color: #555; }

        /* ===== 按钮 ===== */
        .btn { background: #4a6cf7; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .btn:hover { background: #3a5ce7; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-sm { padding: 6px 14px; font-size: 13px; }
        .btn-green { background: #2ecc71; } .btn-green:hover { background: #27ae60; } .btn-green:disabled { background: #333; color: #666; }
        .btn-orange { background: #e67e22; } .btn-orange:hover { background: #d35400; }
        .btn-red { background: #c0392b; } .btn-red:hover { background: #a93226; }
        .btn-ghost { background: transparent; border: 1px solid #444; color: #aaa; }
        .btn-ghost:hover { border-color: #4a6cf7; color: #fff; background: transparent; }

        /* ===== 进度条（真实百分比） ===== */
        .progress-bar { background: #1a1a2e; border-radius: 8px; padding: 16px 24px; margin-bottom: 24px; border: 1px solid #2a2a3e; display: none; }
        .progress-bar.visible { display: block; }
        .progress-bar .label { font-size: 14px; color: #aaa; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .progress-bar .label .pct { color: #4a6cf7; font-weight: 600; }
        .progress-bar .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-bar .bar-fill { height: 100%; background: #4a6cf7; border-radius: 3px; transition: width 0.3s; width: 0%; }
        .progress-bar .bar-fill.indeterminate { width: 30%; animation: indeterminate 1.5s infinite ease-in-out; }
        @keyframes indeterminate { 0%{margin-left:0} 50%{margin-left:70%} 100%{margin-left:0} }

        /* ===== 脚本详情 ===== */
        .storyboard-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
        .storyboard-header h2 { font-size: 22px; color: #fff; }
        .storyboard-header .meta { font-size: 13px; color: #888; margin-top: 6px; }
        .storyboard-header .head-actions { display: flex; gap: 8px; }
        .action-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; background: #14142250; padding: 14px; border-radius: 10px; border: 1px dashed #2a2a3e; }
        .action-bar .info { font-size: 13px; color: #888; margin-left: auto; }
        .action-bar select { background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
        .action-bar .bar-label { font-size: 13px; color: #888; }
        .action-bar .divider { width: 1px; height: 24px; background: #2a2a3e; }
        .action-bar label.subtitle-toggle { font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
        .action-bar label.subtitle-toggle input { accent-color: #4a6cf7; }
        .export-item img.cover-thumb { height: 48px; border-radius: 4px; border: 1px solid #2a2a3e; vertical-align: middle; }
        .status { text-align: center; padding: 40px; color: #888; font-size: 15px; }
        .status.loading { color: #4a6cf7; } .status.error { color: #f74a4a; }

        /* ===== 状态徽章 ===== */
        .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .badge-DRAFT { background: #3a3a4e; color: #aaa; }
        .badge-PENDING { background: #4a3a1e; color: #f5b041; }
        .badge-GENERATING { background: #1e2a4a; color: #4a9cf7; }
        .badge-READY { background: #1a3a2a; color: #2ecc71; }
        .badge-FAILED { background: #3a1a1a; color: #f74a4a; }
        .badge-EXPORTED { background: #2a1a3a; color: #a569f7; }

        /* ===== 镜头卡片 ===== */
        .shots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .shot-card { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a3e; overflow: hidden; transition: border-color 0.2s, opacity 0.2s; cursor: grab; }
        .shot-card:hover { border-color: #4a6cf7; }
        .shot-card.has-image { border-color: #2a3e2a; }
        .shot-card.has-image:hover { border-color: #2ecc71; }
        .shot-card.drag-over { border-color: #e67e22; opacity: 0.6; }
        .shot-card.dragging { opacity: 0.4; }
        .shot-card .drag-hint { font-size: 11px; color: #555; text-align: right; padding: 6px 12px 0; }
        .shot-image { width: 100%; aspect-ratio: 16/9; background: #111; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .shot-image img { width: 100%; height: 100%; object-fit: cover; }
        .shot-image .placeholder { color: #444; font-size: 14px; }
        .shot-image .loading-spinner { color: #4a6cf7; font-size: 14px; }
        .shot-body { padding: 16px; }
        .shot-number { display: inline-block; background: #4a6cf7; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
        .shot-duration { display: inline-block; background: #2a2a3e; color: #aaa; font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
        .shot-scene { font-size: 14px; color: #ccc; margin: 10px 0 8px; line-height: 1.5; }
        .shot-narration { font-size: 13px; color: #888; font-style: italic; margin-bottom: 8px; padding: 8px; background: #0f0f1a; border-radius: 6px; }
        .shot-camera { font-size: 12px; color: #666; margin-bottom: 10px; }
        .shot-prompt { font-size: 12px; color: #555; word-break: break-all; padding: 8px; background: #0a0a15; border-radius: 4px; margin-bottom: 12px; max-height: 100px; overflow-y: auto; }
        .shot-prompt strong { color: #777; }
        .shot-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

        /* ===== 镜头编辑表单 ===== */
        .edit-form { padding: 4px 0; }
        .edit-form label { display: block; font-size: 12px; color: #888; margin: 10px 0 4px; }
        .edit-form textarea { width: 100%; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 13px; font-family: inherit; resize: vertical; min-height: 54px; }
        .edit-form input { width: 100%; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 13px; }
        .edit-form textarea:focus, .edit-form input:focus { outline: none; border-color: #4a6cf7; }
        .edit-form .form-actions { display: flex; gap: 8px; margin-top: 12px; }

        /* ===== 视频结果 ===== */
        .video-result { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a3e; padding: 24px; margin-top: 24px; text-align: center; }
        .video-result h3 { color: #fff; margin-bottom: 16px; font-size: 18px; }
        .video-result video { max-width: 100%; border-radius: 8px; background: #000; }
        .video-result .download-link { display: inline-block; margin-top: 12px; color: #4a6cf7; font-size: 14px; text-decoration: underline; }
        .video-result .meta-tags { margin-top: 10px; font-size: 13px; color: #888; }
        .video-result .meta-tags .badge { margin: 0 3px; }

        /* ===== 导出历史 ===== */
        .export-history { background: #14141f; border: 1px solid #2a2a3e; border-radius: 10px; padding: 16px 20px; margin-top: 16px; }
        .export-history h3 { font-size: 15px; color: #aaa; margin-bottom: 10px; }
        .export-item { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: #888; padding: 8px 0; border-bottom: 1px solid #22222e; }
        .export-item:last-child { border-bottom: none; }
        .export-item a { color: #4a6cf7; text-decoration: none; font-size: 13px; }
        .export-item a:hover { text-decoration: underline; }
        .export-item.failed .failed-text { color: #f74a4a; }

        /* ===== Toast 提示 ===== */
        .toast { position: fixed; top: 20px; right: 20px; max-width: 420px; background: #1a1a2e; border: 1px solid #4a6cf7; border-radius: 10px; padding: 14px 20px; font-size: 14px; color: #e0e0e0; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 999; display: none; }
        .toast.visible { display: block; }
        .toast.error { border-color: #f74a4a; }
        .toast.success { border-color: #2ecc71; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI 短视频工作室</h1>
        <p>创意想法 → 分镜脚本 → 提示词优化 → 批量生成画面（SSE 实时进度） → 快速预览 / BGM 配乐 / 多比例高清导出</p>
    </div>
    <div class="container">
        <!-- 脚本管理栏 -->
        <div class="script-bar">
            <span class="bar-label">我的脚本</span>
            <select id="scriptSelect" onchange="onScriptSelectChange()">
                <option value="">— 选择脚本 —</option>
            </select>
            <button class="btn btn-sm btn-ghost" onclick="loadScriptList()">刷新列表</button>
            <button class="btn btn-sm" onclick="newScriptMode()">+ 新建脚本</button>
            <div class="divider"></div>
            <span class="bar-label">视觉风格</span>
            <select id="styleSelect" onchange="onStyleChange()"></select>
            <div class="divider"></div>
            <span class="bar-label">图像生成器</span>
            <select id="generatorSelect" onchange="switchGenerator()"></select>
        </div>

        <!-- 创意输入区（新建模式显示） -->
        <div class="input-section" id="ideaSection" style="display:none;">
            <label>视频模板（可选，模块 H）</label>
            <div class="input-row">
                <select id="templateSelect" onchange="onTemplateSelect()" style="background:#0f0f1a;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:13px;min-width:280px;">
                    <option value="">不使用模板（自由创作）</option>
                </select>
            </div>
            <div id="templateHint" style="font-size:12px;color:#888;margin:4px 0 8px;"></div>
            <label>创意想法</label>
            <div class="input-row">
                <textarea id="ideaInput" placeholder="描述你的短视频创意，例如：一个关于猫咪日常生活的温馨短片..." rows="2"></textarea>
                <button class="btn" id="generateBtn" onclick="generateScript()">生成分镜脚本</button>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar">
            <div class="label"><span id="progressLabel">处理中...</span><span class="pct" id="progressPct"></span></div>
            <div class="bar"><div class="bar-fill" id="progressFill"></div></div>
        </div>

        <!-- 脚本详情区 -->
        <div id="scriptArea"></div>
        <!-- 角色卡面板（Phase 4 切片 1） -->
        <div class="input-section" id="characterPanel" style="display:none;">
            <h3 style="color:#fff;font-size:16px;margin-bottom:10px">🎭 角色卡 <span style="font-size:12px;color:#888;font-weight:normal">（角色一致性 · 定妆参考图 · 声线）</span></h3>
            <div id="characterList"></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
                <input id="charName" placeholder="角色名" style="background:#0f0f1a;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:13px">
                <input id="charFeatures" placeholder="英文特征表（发型/瞳色/服装/体型）" style="flex:2;background:#0f0f1a;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:13px">
                <select id="charVoiceSelect" style="background:#0f0f1a;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:13px"></select>
                <button class="btn btn-sm" onclick="createCharacter()">保存角色</button>
            </div>
        </div>
        <!-- 空状态 -->
        <div id="emptyArea"><div class="status">选择已有脚本，或点击「+ 新建脚本」输入创意开始</div></div>

        <!-- AI 导演（Phase 3 切片2） -->
        <div class="input-section" id="agentPanel">
            <h3 style="color:#fff;font-size:16px;margin-bottom:10px">🤖 AI 导演 <span style="font-size:12px;color:#888;font-weight:normal">（对话式生成 · 导出需确认）</span></h3>
            <div id="agentLog" style="max-height:260px;overflow-y:auto;background:#12121f;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px"></div>
            <div id="agentConfirmBar" style="display:none;margin-bottom:8px"></div>
            <div style="display:flex;gap:8px">
                <input id="agentInput" placeholder="例如：帮我做一个猫咪日常的治愈系短片" style="flex:1;background:#0f0f1a;border:1px solid #333;border-radius:6px;padding:8px 10px;color:#fff;font-size:13px" onkeydown="if(event.key==='Enter')sendAgentMessage()">
                <button class="btn" id="agentSendBtn" onclick="sendAgentMessage()">发送</button>
                <button class="btn btn-ghost" onclick="clearAgentChat()">清空</button>
                <button class="btn btn-green" id="agentPipelineBtn" onclick="startAgentPipeline()" title="多 Agent 异步流水线：编剧→美术→音频→剪辑，导出需确认">一键流水线</button>
            </div>
        </div>
        <!-- 视频转绘（Phase 4 切片 5：独立输出模式） -->
        <div class="input-section" id="restylePanel">
            <h3 style="color:#fff;font-size:16px;margin-bottom:10px">🎨 视频转绘 <span style="font-size:12px;color:#888;font-weight:normal">（实拍→漫剧画风 · 独立输出 · 需 DASHSCOPE_API_KEY）</span></h3>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                <input type="file" id="restyleFile" accept="video/*" style="font-size:13px;color:#ccc">
                <select id="restyleStyle" style="background:#0f0f1a;border:1px solid #333;color:#e0e0e0;border-radius:6px;padding:6px 10px;font-size:13px">
                    <option value="日系动漫风格，赛璐璐着色，干净线条，保持原有动作与机位">日系动漫</option>
                    <option value="美漫风格，粗墨线，高饱和色彩，保持原有动作与机位">美漫</option>
                    <option value="水彩画风格，柔和边缘，纸张质感，保持原有动作与机位">水彩</option>
                </select>
                <button class="btn" id="restyleSubmitBtn" onclick="submitRestyle()">转绘</button>
            </div>
            <div style="font-size:12px;color:#888;margin-top:6px">mp4/mov、2-10 秒、≤100MB；耗时数分钟，按输入+输出时长计费；local 存储需切换 oss/minio</div>
            <div id="restyleList" style="margin-top:10px"></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
<script>
// ==================== 全局状态 ====================
let currentScript = null;   // 当前加载的脚本（含 shots）
let styles = [];           // 视觉风格预设
let generators = [];        // 图像生成器列表
let editingShotId = null;   // 正在编辑的镜头ID
let draggedShotId = null;   // 拖拽中的镜头ID
let eventSource = null;     // SSE 连接
let batchGenerating = false;// 是否正在批量生成图片
let exporting = false;      // 是否正在导出视频
let bgmList = [];           // BGM 列表（内置 + 用户上传）
let currentBgmId = '';      // 当前选中的 BGM
let currentAspect = '16:9'; // 导出画面比例
let currentResolution = '720p'; // 高清导出分辨率
let currentSubtitle = true; // 导出时是否烧录字幕（模块 F）
let currentSubtitleLang = 'zh'; // 字幕语言：zh 原文 / en 英文 / bilingual 中英双语（模块 F）
let currentWithLogo = false; // 导出时是否叠加品牌 Logo 角标（模块 I，需服务端配置）
let currentUpscale = false; // 导出超分增强（Phase 4 切片 4，需服务端配置 realesrgan）
let currentInterpolate = false; // 导出补帧增强（Phase 4 切片 4，需服务端配置 rife）
let currentSfx = false; // 导出音效混音（Phase 4 切片 4，需服务端开启 video.sfx.enabled）
let currentPlatform = '';  // 社媒平台预设（模块 I；空 = 自定义比例/分辨率）
let platformList = [];     // 平台预设列表（GET /export/platforms 加载）
let templates = [];        // 视频模板列表（模块 H）
let currentTemplateId = ''; // 当前选中的视频模板（空 = 自由创作）

// ==================== 基础工具 ====================
function esc(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

async function api(url, options) {
    try {
        const resp = await fetch(url, options);
        const data = await resp.json().catch(() => ({ success: false, message: '响应解析失败 (HTTP ' + resp.status + ')' }));
        return data;
    } catch (e) {
        return { success: false, message: '请求失败: ' + e.message };
    }
}

function post(url, body) {
    return api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}
function put(url, body) {
    return api(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}

let toastTimer = null;
function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast visible ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 4000);
}

function showProgress(label, indeterminate) {
    document.getElementById('progressBar').classList.add('visible');
    document.getElementById('progressLabel').textContent = label;
    const fill = document.getElementById('progressFill');
    fill.className = 'bar-fill' + (indeterminate ? ' indeterminate' : '');
    if (indeterminate) { fill.style.width = ''; document.getElementById('progressPct').textContent = ''; }
}
function setProgress(percent) {
    document.getElementById('progressFill').className = 'bar-fill';
    document.getElementById('progressFill').style.width = Math.min(100, Math.max(0, percent)) + '%';
    document.getElementById('progressPct').textContent = Math.round(percent) + '%';
}
function hideProgress() { document.getElementById('progressBar').classList.remove('visible'); }

// ==================== 页面初始化 ====================
async function init() {
    // 登录检测：页面与 /api/video/** 均为 permitAll，但业务接口依赖登录用户
    // /api/auth/user 返回 {loggedIn, username}，无 success 字段（release 审查 C1）
    const auth = await api('/api/auth/user');
    if (!auth.loggedIn) {
        document.getElementById('emptyArea').innerHTML =
            '<div class="status error">请先 <a href="/login" style="color:#4a6cf7;">登录</a> 后使用短视频工作室</div>';
        return;
    }
    await Promise.all([loadStyles(), loadGenerators(), loadBgmList(), loadPlatforms(), loadTemplates(), loadVoices(), loadVideoGenerators()]);
    await loadScriptList();
    loadRestyleTasks();
}
window.addEventListener('DOMContentLoaded', init);

// ==================== 风格与生成器 ====================
async function loadStyles() {
    const data = await api('/api/video/enhance-prompt/styles');
    if (!data.success) return;
    styles = data.data || [];
    const sel = document.getElementById('styleSelect');
    sel.innerHTML = '<option value="">默认（电影写实）</option>' +
        styles.map(s => '<option value="' + esc(s.name) + '">' + esc(s.displayName) + '</option>').join('');
}

async function loadGenerators() {
    const data = await api('/api/video/images/generators');
    if (!data.success) return;
    generators = data.data || [];
    const sel = document.getElementById('generatorSelect');
    sel.innerHTML = generators.map(g =>
        '<option value="' + esc(g.type) + '"' + (g.active ? ' selected' : '') + '>' +
        esc(g.name) + (g.available ? '' : '（不可用）') + '</option>').join('');
}

async function switchGenerator() {
    const type = document.getElementById('generatorSelect').value;
    const data = await put('/api/video/images/generator?type=' + encodeURIComponent(type));
    if (data.success) toast('图像生成器已切换为: ' + type, 'success');
    else { toast(data.message || '切换失败', 'error'); loadGenerators(); }
}

function currentStyle() { return document.getElementById('styleSelect').value; }

// ==================== 视频模板（模块 H） ====================
async function loadTemplates() {
    const data = await api('/api/video/templates');
    if (!data.success) return;
    templates = data.data || [];
    const sel = document.getElementById('templateSelect');
    if (!sel) return;
    sel.innerHTML = '<option value="">不使用模板（自由创作）</option>' +
        templates.map(function(t) {
            return '<option value="' + t.id + '"' + (String(currentTemplateId) === String(t.id) ? ' selected' : '') + '>' +
                esc(t.name) + '（' + esc(t.category || 'other') + (t.isSystem ? '·内置' : '·自定义') + '）</option>';
        }).join('');
    onTemplateSelect();
}

function onTemplateSelect() {
    const sel = document.getElementById('templateSelect');
    currentTemplateId = sel ? sel.value : '';
    const hint = document.getElementById('templateHint');
    if (!hint) return;
    const t = templates.find(function(x) { return String(x.id) === String(currentTemplateId); });
    hint.textContent = t
        ? (t.description || '') + '（推荐 ' + t.shotCount + ' 个镜头' + (t.defaultBgmCategory ? '，配乐风格 ' + t.defaultBgmCategory : '') + '）'
        : '';
}

async function saveAsTemplate() {
    if (!currentScript) return;
    const name = prompt('自定义模板名称:', (currentScript.title || '我的模板') + ' 风格');
    if (!name || !name.trim()) return;
    const styleName = currentStyle();
    const style = styles.find(function(s) { return s.name === styleName; });
    const body = {
        name: name.trim(),
        category: 'other',
        description: '从脚本「' + (currentScript.title || currentScript.id) + '」另存',
        shotCount: (currentScript.shots || []).length || 5,
        stylePrefix: style ? style.promptPrefix : '',
        defaultBgmCategory: ''
    };
    const data = await post('/api/video/templates/custom', body);
    if (!data.success) { toast(data.message || '模板保存失败', 'error'); return; }
    toast('自定义模板已保存，新建脚本时可选用', 'success');
    await loadTemplates();
}

// ==================== 脚本列表与加载 ====================
async function loadScriptList(keepSelection) {
    const data = await api('/api/video/scripts');
    if (!data.success) { toast(data.message || '获取脚本列表失败（请先登录）', 'error'); return; }
    const sel = document.getElementById('scriptSelect');
    const prev = keepSelection ? sel.value : (currentScript ? currentScript.id : '');
    sel.innerHTML = '<option value="">— 选择脚本 —</option>' +
        (data.data || []).map(s =>
            '<option value="' + s.id + '">' + esc(s.title || ('脚本 #' + s.id)) + ' (' + s.shotCount + '镜头 · ' + esc(s.status) + ')</option>').join('');
    if (prev) sel.value = prev;
}

function newScriptMode() {
    currentScript = null;
    document.getElementById('scriptSelect').value = '';
    document.getElementById('ideaSection').style.display = '';
    document.getElementById('scriptArea').innerHTML = '';
    document.getElementById('emptyArea').style.display = 'none';
    document.getElementById('ideaInput').focus();
}

async function onScriptSelectChange() {
    const id = document.getElementById('scriptSelect').value;
    if (!id) { currentScript = null; document.getElementById('scriptArea').innerHTML = ''; document.getElementById('emptyArea').style.display = ''; return; }
    await loadScriptDetail(id);
}

async function loadScriptDetail(id) {
    const data = await api('/api/video/scripts/' + id);
    if (!data.success) { toast(data.message || '加载脚本失败', 'error'); return; }
    currentScript = data.data;
    editingShotId = null;
    document.getElementById('styleSelect').value = data.data.style || '';
    document.getElementById('ideaSection').style.display = 'none';
    document.getElementById('emptyArea').style.display = 'none';
    renderScript();
    loadCharacters(id);
    loadExportHistory();
    loadCandidateFlags();
}

// ==================== 脚本生成（模块 A） ====================
async function generateScript() {
    const idea = document.getElementById('ideaInput').value.trim();
    if (!idea) { toast('请输入创意想法', 'error'); return; }
    const btn = document.getElementById('generateBtn');
    btn.disabled = true; btn.textContent = '生成中...';
    showProgress('正在生成分镜脚本，请稍候（约 15-30 秒）...', true);
    // 模块 H：选中模板时走模板应用接口（风格引导注入 System Prompt）
    const data = currentTemplateId
        ? await post('/api/video/templates/' + currentTemplateId + '/apply', { idea })
        : await post('/api/video/scripts/generate', { idea });
    btn.disabled = false; btn.textContent = '生成分镜脚本';
    hideProgress();
    if (!data.success) { toast(data.message || '生成失败', 'error'); return; }
    toast('分镜脚本生成成功', 'success');
    await loadScriptList(true);
    document.getElementById('scriptSelect').value = data.data.id;
    currentScript = data.data;
    document.getElementById('styleSelect').value = data.data.style || '';
    document.getElementById('ideaSection').style.display = 'none';
    document.getElementById('emptyArea').style.display = 'none';
    renderScript();
    loadCharacters(data.data.id);
}

// ==================== 脚本信息管理 ====================
async function renameScript() {
    if (!currentScript) return;
    const title = prompt('新的脚本标题:', currentScript.title || '');
    if (!title || title.trim() === '') return;
    const data = await put('/api/video/scripts/' + currentScript.id, { title: title.trim() });
    if (data.success) { toast('标题已更新', 'success'); await loadScriptList(true); currentScript.title = title.trim(); renderScript(); }
    else toast(data.message || '更新失败', 'error');
}

async function deleteScript() {
    if (!currentScript) return;
    if (!confirm('确定删除脚本「' + (currentScript.title || currentScript.id) + '」？此操作不可恢复。')) return;
    const data = await api('/api/video/scripts/' + currentScript.id, { method: 'DELETE' });
    if (!data.success) { toast(data.message || '删除失败', 'error'); return; }
    toast('脚本已删除', 'success');
    currentScript = null;
    document.getElementById('scriptArea').innerHTML = '';
    document.getElementById('emptyArea').style.display = '';
    await loadScriptList();
}

// ==================== 角色卡（Phase 4 切片 1） ====================
let currentCharacters = [];
let editingCharacterId = null;
let voiceList = [];

async function loadVoices() {
    const d = await api('/api/video/characters/voices');
    if (!d.success) return;
    voiceList = d.data || [];
    document.getElementById('charVoiceSelect').innerHTML = voiceList.map(v =>
        '<option value="' + esc(v.name) + '">' + esc(v.name) + '</option>').join('');
}

async function loadCharacters(scriptId) {
    const d = await api('/api/video/characters?scriptId=' + scriptId);
    currentCharacters = d.success ? (d.data || []) : [];
    renderCharacters();
    if (currentScript) renderScript();
}

function renderCharacters() {
    const panel = document.getElementById('characterPanel');
    if (!currentScript) { panel.style.display = 'none'; return; }
    panel.style.display = '';
    document.getElementById('characterList').innerHTML = currentCharacters.map(c =>
        '<div style="display:flex;gap:8px;align-items:center;background:#12121f;border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px">' +
        (c.referenceImageUrl ? '<img src="' + esc(c.referenceImageUrl) + '" style="width:40px;height:40px;object-fit:cover;border-radius:6px">' : '<span style="width:40px;height:40px;background:#222;border-radius:6px;display:inline-block"></span>') +
        '<div style="flex:1"><strong>' + esc(c.name) + '</strong> <span style="color:#888">' + esc(c.voice || '') + '</span>' +
        '<div style="color:#aaa;font-size:12px">' + esc((c.featureTable || '').slice(0, 80)) + '</div></div>' +
        '<button class="btn btn-sm btn-ghost" onclick="startEditCharacter(' + c.id + ')">编辑</button>' +
        '<button class="btn btn-sm btn-ghost" onclick="document.getElementById(\'charRefInput-' + c.id + '\').click()">定妆图</button>' +
        '<input type="file" id="charRefInput-' + c.id + '" accept="image/*" style="display:none" onchange="uploadCharacterRef(' + c.id + ',this)">' +
        '<button class="btn btn-sm btn-red" onclick="deleteCharacter(' + c.id + ')">删除</button></div>').join('') ||
        '<div style="color:#888;font-size:13px">暂无角色卡（随分镜脚本自动生成，也可手动添加）</div>';
}

function startEditCharacter(id) {
    const c = currentCharacters.find(x => x.id === id);
    if (!c) return;
    editingCharacterId = id;
    document.getElementById('charName').value = c.name || '';
    document.getElementById('charFeatures').value = c.featureTable || '';
    document.getElementById('charVoiceSelect').value = c.voice || 'zh-CN-XiaoxiaoNeural';
}

async function createCharacter() {
    if (!currentScript) return;
    const body = { name: document.getElementById('charName').value, featureTable: document.getElementById('charFeatures').value, voice: document.getElementById('charVoiceSelect').value };
    const d = editingCharacterId
        ? await put('/api/video/characters/' + editingCharacterId + '?scriptId=' + currentScript.id, body)
        : await post('/api/video/characters?scriptId=' + currentScript.id, body);
    if (!d.success) { toast(d.message || '保存失败', 'error'); return; }
    editingCharacterId = null;
    document.getElementById('charName').value = '';
    document.getElementById('charFeatures').value = '';
    toast('角色卡已保存', 'success');
    await loadCharacters(currentScript.id);
}

async function deleteCharacter(id) {
    if (!confirm('删除该角色卡？')) return;
    const d = await api('/api/video/characters/' + id + '?scriptId=' + currentScript.id, { method: 'DELETE' });
    if (!d.success) { toast(d.message || '删除失败', 'error'); return; }
    await loadCharacters(currentScript.id);
}

async function uploadCharacterRef(id, input) {
    if (!input.files.length) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    const d = await api('/api/video/characters/' + id + '/reference-image?scriptId=' + currentScript.id, { method: 'POST', body: fd });
    if (!d.success) { toast(d.message || '上传失败', 'error'); return; }
    toast('定妆参考图已上传', 'success');
    input.value = '';
    await loadCharacters(currentScript.id);
}

async function onStyleChange() {
    if (!currentScript) return;
    const d = await put('/api/video/scripts/' + currentScript.id + '/style', { style: document.getElementById('styleSelect').value });
    if (d.success) { currentScript.style = d.data.style; toast('脚本级画风已锁定', 'success'); }
    else toast(d.message || '更新失败', 'error');
}

// ==================== 图生视频（Phase 4 切片 2） ====================
let videoGenerators = [];

async function loadVideoGenerators() {
    const d = await api('/api/video/videos/generators');
    if (!d.success) return;
    videoGenerators = d.data || [];
    fillVideoGeneratorSelect();
}

/** 从缓存装配下拉；元素由 renderScript 动态创建，init 时不存在需 guard（切片 2 审查 C1） */
function fillVideoGeneratorSelect() {
    const sel = document.getElementById('videoGeneratorSelect');
    if (!sel) return;
    sel.innerHTML = videoGenerators.map(g =>
        '<option value="' + esc(g.type) + '"' + (g.active ? ' selected' : '') + '>' +
        esc(g.name) + (g.available ? '' : '（不可用）') + '</option>').join('');
}

async function switchVideoGenerator() {
    const type = document.getElementById('videoGeneratorSelect').value;
    const d = await put('/api/video/videos/generator?type=' + encodeURIComponent(type));
    if (d.success) toast('视频生成器已切换为: ' + type, 'success');
    else { toast(d.message || '切换失败', 'error'); loadVideoGenerators(); }
}

async function onContinuityChange() {
    if (!currentScript) return;
    const d = await put('/api/video/scripts/' + currentScript.id + '/continuity', { mode: document.getElementById('continuitySelect').value });
    if (d.success) { currentScript.continuityMode = d.data.continuityMode; toast('连续性模式已更新', 'success'); }
    else toast(d.message || '更新失败', 'error');
}

async function generateShotVideo(shotId) {
    showProgress('正在图生视频（约 1-5 分钟）...', true);
    const d = await post('/api/video/videos/shot/' + currentScript.id + '/' + shotId);
    hideProgress();
    if (!d.success) { toast(d.message || '视频生成失败', 'error'); return; }
    toast('镜头视频已生成', 'success');
    await loadScriptDetail(currentScript.id);
}

function generateAllVideos() {
    if (!currentScript) return;
    showProgress('批量图生视频...', true);
    const es = new EventSource('/api/video/videos/script/' + currentScript.id + '/stream');
    es.onmessage = async (ev) => {
        try {
            const p = JSON.parse(ev.data);
            if (p.type === 'VIDEO_BATCH_COMPLETE' || p.type === 'ERROR') {
                es.close(); hideProgress();
                if (p.type === 'ERROR') toast(p.message || '批量视频生成失败', 'error');
                else toast('批量视频生成完成', 'success');
                await loadScriptDetail(currentScript.id);
            }
        } catch (e) { /* 忽略非 JSON 心跳 */ }
    };
    es.onerror = () => { es.close(); hideProgress(); loadScriptDetail(currentScript.id); };
}

// ==================== 候选抽卡与局部重绘（Phase 4 切片 3） ====================
let candidateFlags = {};   // shotId -> 存在未 selected 候选（待择优徽章）
let currentCandidateShotId = null;

function activeVideoGeneratorType() {
    const g = videoGenerators.find(x => x.active);
    return g ? g.type : 'none';
}

async function loadCandidateFlags() {
    if (!currentScript || !currentScript.shots) return;
    const entries = await Promise.all(currentScript.shots.map(async s => {
        const d = await api('/api/video/candidates?scriptId=' + currentScript.id + '&shotId=' + s.id);
        const list = d.success ? (d.data || []) : [];
        return [s.id, list.some(c => !c.selected)];
    }));
    candidateFlags = Object.fromEntries(entries);
    renderScript();
}

async function generateCandidates(shotId, type) {
    showProgress(type === 'VIDEO' ? '抽卡视频候选（约数分钟）...' : '抽卡图像候选...', true);
    const d = await post('/api/video/candidates/generate', { scriptId: currentScript.id, shotId: shotId, type: type });
    hideProgress();
    if (!d.success) { toast(d.message || '抽卡失败', 'error'); return; }
    toast('抽卡完成：' + (d.data || []).length + ' 个候选，已暂取最高分，请择优', 'success');
    await loadScriptDetail(currentScript.id);
    openCandidateModal(shotId);
}

function modalHolder(id) {
    let holder = document.getElementById(id);
    if (!holder) { holder = document.createElement('div'); holder.id = id; document.body.appendChild(holder); }
    return holder;
}
const MODAL_OVERLAY = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000';
const MODAL_BOX = 'background:#1e2130;border:1px solid #333;border-radius:12px;padding:20px;max-height:85vh;overflow:auto';

async function openCandidateModal(shotId) {
    currentCandidateShotId = shotId;
    const d = await api('/api/video/candidates?scriptId=' + currentScript.id + '&shotId=' + shotId);
    if (!d.success) { toast(d.message || '获取候选失败', 'error'); return; }
    const list = d.data || [];
    let h = '<div style="' + MODAL_OVERLAY + '" onclick="if(event.target===this)closeCandidateModal()">';
    h += '<div style="' + MODAL_BOX + ';width:860px"><h3 style="margin:0 0 8px">镜头候选 · 择优选用</h3>';
    if (!list.length) h += '<div class="status">暂无候选，可在镜头卡片点「抽卡图/抽卡视频」生成。</div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:12px 0">';
    list.forEach(c => {
        h += '<div style="border:1px solid ' + (c.selected ? '#4a6cf7' : '#333') + ';border-radius:8px;padding:8px">';
        h += c.type === 'VIDEO'
            ? '<video src="' + esc(c.url) + '" controls style="width:100%;border-radius:6px"></video>'
            : '<img src="' + esc(c.url) + '" style="width:100%;border-radius:6px">';
        h += '<div style="font-size:12px;color:#aaa;margin:6px 0">' + esc(c.type)
            + (c.qualityScore != null ? ' · 评分 ' + Number(c.qualityScore).toFixed(1) : '')
            + (c.durationSeconds ? ' · ' + c.durationSeconds + 's' : '')
            + (c.selected ? ' · <span style="color:#4a6cf7">已选用</span>' : '') + '</div>';
        h += '<button class="btn btn-sm" onclick="selectCandidate(' + c.id + ')"' + (c.selected ? ' disabled' : '') + '>选用</button>';
        h += '</div>';
    });
    h += '</div><div class="form-actions"><button class="btn btn-sm btn-ghost" onclick="closeCandidateModal()">关闭</button></div></div></div>';
    modalHolder('candidateModalHolder').innerHTML = h;
}
function closeCandidateModal() { modalHolder('candidateModalHolder').innerHTML = ''; }

async function selectCandidate(candidateId) {
    const d = await post('/api/video/candidates/' + candidateId + '/select?scriptId=' + currentScript.id);
    if (!d.success) { toast(d.message || '选用失败', 'error'); return; }
    toast('已选用，主资产已回写', 'success');
    const shotId = currentCandidateShotId;
    await loadScriptDetail(currentScript.id);
    openCandidateModal(shotId);
}

function openInpaintDialog(shotId) {
    let h = '<div style="' + MODAL_OVERLAY + '" onclick="if(event.target===this)closeInpaintDialog()">';
    h += '<div style="' + MODAL_BOX + ';width:440px"><h3 style="margin:0 0 8px">局部重绘（框选）</h3>';
    h += '<div style="font-size:12px;color:#aaa">坐标为相对原图百分比（0-100）；产物入候选，不直接覆盖主图。需 wan27 生成器。</div>';
    h += '<div style="display:flex;gap:10px;margin:12px 0;flex-wrap:wrap">';
    [['inpX', 'X%', 10], ['inpY', 'Y%', 10], ['inpW', '宽%', 40], ['inpH', '高%', 40]].forEach(f => {
        h += '<label style="font-size:12px;color:#ccc">' + f[1] + '<br><input type="number" id="' + f[0] + '" value="' + f[2] + '" min="0" max="100" style="width:70px"></label>';
    });
    h += '</div><textarea id="inpInstruction" placeholder="重绘指令，如：把雨伞换成红色" style="width:100%;min-height:64px"></textarea>';
    h += '<div class="form-actions"><button class="btn btn-sm" onclick="submitInpaint(' + shotId + ')">开始重绘</button>';
    h += '<button class="btn btn-sm btn-ghost" onclick="closeInpaintDialog()">取消</button></div></div></div>';
    modalHolder('inpaintModalHolder').innerHTML = h;
}
function closeInpaintDialog() { modalHolder('inpaintModalHolder').innerHTML = ''; }

async function submitInpaint(shotId) {
    const x = parseFloat(document.getElementById('inpX').value) / 100;
    const y = parseFloat(document.getElementById('inpY').value) / 100;
    const w = parseFloat(document.getElementById('inpW').value) / 100;
    const h = parseFloat(document.getElementById('inpH').value) / 100;
    const instruction = document.getElementById('inpInstruction').value.trim();
    if (!instruction) { toast('请输入重绘指令', 'error'); return; }
    showProgress('局部重绘中...', true);
    const d = await post('/api/video/images/inpaint', { shotId: shotId, x: x, y: y, w: w, h: h, instruction: instruction });
    hideProgress();
    if (!d.success) { toast(d.message || '重绘失败', 'error'); return; }
    toast('重绘完成，已入候选', 'success');
    closeInpaintDialog();
    await loadScriptDetail(currentScript.id);
    openCandidateModal(shotId);
}

// ==================== 渲染 ====================
function renderScript() {
    if (!currentScript) return;
    const sc = currentScript;
    const total = sc.shots ? sc.shots.length : 0;
    const readyCount = sc.shots ? sc.shots.filter(s => s.imageStatus === 'READY').length : 0;
    const totalDuration = sc.shots ? sc.shots.reduce((sum, s) => sum + (s.durationSeconds || 0), 0) : (sc.totalDuration || 0);
    const allReady = total > 0 && readyCount === total;

    let h = '<div class="storyboard-header">';
    h += '<div><h2>' + esc(sc.title) + '<span class="badge badge-' + esc(sc.status) + '">' + esc(sc.status) + '</span></h2>';
    h += '<div class="meta">' + esc(sc.theme || '') + ' | ' + total + ' 个镜头 | 总时长 ' + totalDuration + 's</div></div>';
    h += '<div class="head-actions"><button class="btn btn-sm btn-ghost" onclick="renameScript()">重命名</button>';
    h += '<button class="btn btn-sm btn-ghost" onclick="saveAsTemplate()" title="将当前脚本的镜头数与视觉风格另存为自定义模板">另存为模板</button>';
    h += '<button class="btn btn-sm btn-red" onclick="deleteScript()">删除脚本</button></div>';
    h += '</div>';

    h += '<div class="action-bar">';
    h += '<button class="btn btn-sm btn-orange" id="enhanceAllBtn" onclick="enhanceAllPrompts()" ' + (batchGenerating ? 'disabled' : '') + '>批量优化提示词</button>';
    h += '<button class="btn btn-sm btn-green" id="genAllBtn" onclick="generateAllImages()" ' + (batchGenerating || allReady ? 'disabled' : '') + '>一键生成所有图片</button>';
    h += '<button class="btn btn-sm" id="addShotBtn" onclick="addShot()" ' + (batchGenerating ? 'disabled' : '') + '>+ 添加镜头</button>';
    // 导出工具组（模块 C：预览/多比例高清导出；模块 D：BGM）
    h += '<span class="divider"></span>';
    h += '<span class="bar-label">BGM</span>';
    h += '<select id="bgmSelect" onchange="onBgmSelectChange()" title="背景音乐，导出时自动降低音量并淡入淡出">' + bgmOptionsHtml() + '</select>';
    h += '<button class="btn btn-sm btn-ghost" onclick="recommendBgm()" title="AI 根据脚本主题推荐配乐">AI推荐</button>';
    h += '<button class="btn btn-sm btn-ghost" onclick="document.getElementById(\'bgmFileInput\').click()" title="上传自定义 BGM（mp3/wav/ogg/m4a/flac）">上传</button>';
    h += '<input type="file" id="bgmFileInput" accept=".mp3,.wav,.ogg,.m4a,.flac" style="display:none" onchange="uploadBgmFile(this)">';
    h += '<label class="subtitle-toggle"><input type="checkbox" id="subtitleToggle"' + (currentSubtitle ? ' checked' : '') + ' onchange="currentSubtitle=this.checked" title="将旁白烧录进视频画面（社媒静音观看友好，无旁白时自动忽略）"> 烧录字幕</label>';
    h += '<select id="subtitleLangSelect" onchange="currentSubtitleLang=this.value" title="字幕语言：英文/双语由 LLM 翻译旁白生成（TTS 配音仍为中文原文）">';
    h += '<option value="zh"' + (currentSubtitleLang === 'zh' ? ' selected' : '') + '>字幕:中文</option>';
    h += '<option value="en"' + (currentSubtitleLang === 'en' ? ' selected' : '') + '>字幕:English</option>';
    h += '<option value="bilingual"' + (currentSubtitleLang === 'bilingual' ? ' selected' : '') + '>字幕:双语</option>';
    h += '</select>';

        '<option value="NONE"' + ((sc.continuityMode || 'NONE') === 'NONE' ? ' selected' : '') + '>连续性:关</option>' +

    h += '<div class="shots-grid">';
    (sc.shots || []).forEach(shot => { h += shotCardHtml(shot); });
    h += '</div><div id="videoResultArea"></div><div id="exportHistoryArea"></div>';

    document.getElementById('scriptArea').innerHTML = h;

function shotCardHtml(shot) {
    const hasImg = shot.imageUrl && shot.imageStatus === 'READY';
    const hasVideo = shot.videoUrl && shot.videoStatus === 'READY';
    let imgH = '<span class="placeholder">' + (shot.imageStatus === 'FAILED' ? '<span style="color:#f74a4a">生成失败</span>' : (shot.imageStatus === 'GENERATING' ? '<span class="loading-spinner">生成中...</span>' : '未生成图片')) + '</span>';
    if (hasVideo) imgH = '<video src="' + esc(shot.videoUrl) + '" controls style="width:100%;height:100%;object-fit:cover"></video>';
    else if (hasImg) imgH = '<img src="' + esc(shot.imageUrl) + '" alt="Shot ' + shot.shotOrder + '">';

    let h = '<div class="shot-card ' + (hasImg ? 'has-image' : '') + '" id="shot-' + shot.id + '" draggable="true" ondragstart="dragStart(event, ' + shot.id + ')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, ' + shot.id + ')">';
    h += '<div class="drag-hint">⋮⋮ 拖拽排序</div>';
    h += '<div class="shot-image" id="shot-image-' + shot.id + '">' + imgH + '</div>';
    h += '<div class="shot-body">';
    h += '<span class="shot-number">镜头 ' + shot.shotOrder + '</span><span class="shot-duration">' + shot.durationSeconds + 's</span><span class="badge badge-' + esc(shot.imageStatus) + '">' + esc(shot.imageStatus) + '</span>' + (candidateFlags[shot.id] ? '<span class="badge" style="background:#8a6d1a;color:#ffd75e" title="存在未选用候选，主资产为暂取最高分">待择优</span>' : '') + qualityBadgeHtml(shot.qualityScore, shot.id);

    if (editingShotId === shot.id) {
        h += '<div class="edit-form">';
        h += '<label>画面描述</label><textarea id="edit-scene-' + shot.id + '">' + esc(shot.sceneDescription) + '</textarea>';
        h += '<label>旁白</label><textarea id="edit-narr-' + shot.id + '">' + esc(shot.narration) + '</textarea>';
        h += '<label>对白（角色台词，TTS 用角色声线）</label><textarea id="edit-dialogue-' + shot.id + '">' + esc(shot.dialogue) + '</textarea>';
        h += '<label>对白角色</label><select id="edit-dialogue-char-' + shot.id + '"><option value="">无（旁白声线）</option>' + currentCharacters.map(c => '<option value="' + c.id + '"' + (String(c.id) === String(shot.dialogueCharacterId) ? ' selected' : '') + '>' + esc(c.name) + (c.voice ? '（' + esc(c.voice) + '）' : '') + '</option>').join('') + '</select>';
        h += '<label>图像提示词（英文）</label><textarea id="edit-prompt-' + shot.id + '" style="min-height:70px">' + esc(shot.imagePrompt) + '</textarea>';
        h += '<label>镜头运动</label><input id="edit-camera-' + shot.id + '" value="' + esc(shot.cameraMovement) + '">';
        h += '<label>景别</label><select id="edit-size-' + shot.id + '"><option value="CLOSE"' + (shot.shotSize === 'CLOSE' ? ' selected' : '') + '>特写</option><option value="MEDIUM"' + (!shot.shotSize || shot.shotSize === 'MEDIUM' ? ' selected' : '') + '>中景</option><option value="LONG"' + (shot.shotSize === 'LONG' ? ' selected' : '') + '>远景</option></select>';
        h += '<label>出场角色</label><div style="display:flex;gap:6px;flex-wrap:wrap">' + (currentCharacters.length ? currentCharacters.map(c => '<label style="font-size:12px;color:#ccc"><input type="checkbox" class="edit-char-' + shot.id + '" value="' + c.id + '"' + ((shot.characterIds || []).includes(c.id) ? ' checked' : '') + '> ' + esc(c.name) + '</label>').join('') : '<span style="color:#888;font-size:12px">暂无角色卡</span>') + '</div>';
        h += '<label>时长（秒）</label><input type="number" min="1" max="30" id="edit-dur-' + shot.id + '" value="' + (shot.durationSeconds || 5) + '">';
        h += '<div class="form-actions"><button class="btn btn-sm" onclick="saveShotEdit(' + shot.id + ')">保存</button><button class="btn btn-sm btn-ghost" onclick="toggleShotEdit(null)">取消</button></div>';
        h += '</div>';
    } else {
        h += '<div class="shot-scene">' + esc(shot.sceneDescription) + '</div>';
        h += '<div class="shot-narration">' + esc(shot.narration) + '</div>';
        if (shot.dialogue) { const dc = currentCharacters.find(x => String(x.id) === String(shot.dialogueCharacterId)); h += '<div class="shot-narration" style="font-style:normal;color:#aac">对白' + (dc ? '（' + esc(dc.name) + '）' : '') + ': ' + esc(shot.dialogue) + '</div>'; }
        h += '<div class="shot-camera">镜头运动: ' + esc(shot.cameraMovement || '固定') + ' | 景别: ' + esc(shot.shotSize || 'MEDIUM') + ((shot.characterIds || []).length ? ' | 角色: ' + (shot.characterIds || []).map(id => { const c = currentCharacters.find(x => x.id === id); return c ? esc(c.name) : id; }).join(', ') : '') + '</div>';
        h += '<div class="shot-prompt"><strong>Image Prompt: </strong>' + esc(shot.imagePrompt) + '</div>';
        h += '<div class="shot-actions">';
        h += '<button class="btn btn-sm btn-ghost" onclick="toggleShotEdit(' + shot.id + ')">编辑</button>';
        h += '<button class="btn btn-sm btn-orange" onclick="enhanceShotPrompt(' + shot.id + ')" ' + (batchGenerating ? 'disabled' : '') + '>优化提示词</button>';
        h += '<button class="btn btn-sm" onclick="generateShotImage(' + shot.id + ')" ' + (batchGenerating ? 'disabled' : '') + '>' + (hasImg ? '重新生成' : '生成图片') + '</button>';
        h += '<button class="btn btn-sm btn-orange" onclick="generateShotVideo(' + shot.id + ')" ' + (batchGenerating || !hasImg ? 'disabled' : '') + ' title="图生视频（需已生成图片；video.generator=none 时不可用）">' + (hasVideo ? '重生成视频' : '生成视频') + '</button>';
        h += '<button class="btn btn-sm btn-ghost" onclick="generateCandidates(' + shot.id + ',\'IMAGE\')" ' + (batchGenerating ? 'disabled' : '') + ' title="抽卡多候选图像，评分排序后人工择优">抽卡图</button>';
        h += '<button class="btn btn-sm btn-ghost" onclick="generateCandidates(' + shot.id + ',\'VIDEO\')" ' + (batchGenerating || !hasImg || activeVideoGeneratorType() === 'none' ? 'disabled' : '') + ' title="抽卡多候选视频（需已生成图片且视频生成器非 none）">抽卡视频</button>';
        h += '<button class="btn btn-sm btn-ghost" onclick="openInpaintDialog(' + shot.id + ')" ' + (!hasImg ? 'disabled' : '') + ' title="框选局部重绘（需 wan27），产物入候选">重绘</button>';
        h += '<button class="btn btn-sm btn-ghost" onclick="openCandidateModal(' + shot.id + ')">候选</button>';
        h += '<button class="btn btn-sm btn-red" onclick="deleteShot(' + shot.id + ')">删除</button>';
        h += '</div>';
    }
    h += '</div></div>';
    return h;
}

// ==================== 镜头编辑（模块 A） ====================
function toggleShotEdit(shotId) {
    editingShotId = shotId;
    renderScript();
}

async function saveShotEdit(shotId) {
    const promptChanged = document.getElementById('edit-prompt-' + shotId).value !== (findShot(shotId).imagePrompt || '');
    const body = {
        sceneDescription: document.getElementById('edit-scene-' + shotId).value,
        narration: document.getElementById('edit-narr-' + shotId).value,
        dialogue: document.getElementById('edit-dialogue-' + shotId).value,
        dialogueCharacterId: parseInt(document.getElementById('edit-dialogue-char-' + shotId).value) || null,
        imagePrompt: document.getElementById('edit-prompt-' + shotId).value,
        cameraMovement: document.getElementById('edit-camera-' + shotId).value,
        shotSize: document.getElementById('edit-size-' + shotId).value,
        characterIds: Array.from(document.querySelectorAll('.edit-char-' + shotId + ':checked')).map(el => parseInt(el.value)),
        durationSeconds: parseInt(document.getElementById('edit-dur-' + shotId).value) || 5
    };
    const data = await put('/api/video/scripts/' + currentScript.id + '/shots/' + shotId, body);
    if (!data.success) { toast(data.message || '保存失败', 'error'); return; }
    toast('镜头已更新' + (promptChanged ? '，提示词已变化，需重新生成图片' : ''), 'success');
    await loadScriptDetail(currentScript.id);
    document.getElementById('scriptSelect').value = currentScript.id;
}

function findShot(shotId) { return (currentScript.shots || []).find(s => s.id === shotId); }

// 质量评分徽章（模块 J：未启用评估时不显示）
function qualityBadgeHtml(score, shotId) {
    if (score == null) return '';
    const color = score >= 8 ? '#2ecc71' : (score >= 6 ? '#f39c12' : '#f74a4a');
    return '<span class="badge" id="quality-badge-' + shotId + '" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + '" title="图片质量综合评分（0-10）">质量 ' + Number(score).toFixed(1) + '</span>';
}

async function deleteShot(shotId) {
    if (!confirm('确定删除该镜头？')) return;
    const data = await api('/api/video/scripts/' + currentScript.id + '/shots/' + shotId, { method: 'DELETE' });
    if (!data.success) { toast(data.message || '删除失败', 'error'); return; }
    toast('镜头已删除', 'success');
    await loadScriptDetail(currentScript.id);
}

async function addShot() {
    const data = await post('/api/video/scripts/' + currentScript.id + '/shots', {
        sceneDescription: '新的镜头（请编辑画面描述）',
        narration: '', imagePrompt: '', cameraMovement: '固定', durationSeconds: 5, imageStatus: 'PENDING'
    });
    if (!data.success) { toast(data.message || '添加失败', 'error'); return; }
    toast('镜头已添加', 'success');
    await loadScriptDetail(currentScript.id);
}

// ==================== 拖拽排序（模块 A） ====================
function dragStart(e, shotId) {
    draggedShotId = shotId;
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('dragging');
}
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

async function drop(e, targetShotId) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!draggedShotId || draggedShotId === targetShotId) return;
    const shots = currentScript.shots;
    const from = shots.findIndex(s => s.id === draggedShotId);
    const to = shots.findIndex(s => s.id === targetShotId);
    if (from < 0 || to < 0) return;
    const moved = shots.splice(from, 1)[0];
    shots.splice(to, 0, moved);
    shots.forEach((s, i) => { s.shotOrder = i + 1; });
    draggedShotId = null;
    renderScript();
    const data = await put('/api/video/scripts/' + currentScript.id + '/shots/reorder', { shotIds: shots.map(s => s.id) });
    if (data.success) toast('镜头顺序已更新', 'success');
    else { toast(data.message || '排序保存失败', 'error'); await loadScriptDetail(currentScript.id); }
}

// ==================== 提示词优化（模块 B） ====================
async function enhanceShotPrompt(shotId) {
    const shot = findShot(shotId);
    if (!shot) return;
    const source = shot.imagePrompt && shot.imagePrompt.trim() ? shot.imagePrompt : shot.sceneDescription;
    if (!source || !source.trim()) { toast('该镜头没有可优化的提示词或画面描述', 'error'); return; }
    toast('正在优化镜头 ' + shot.shotOrder + ' 的提示词...', '');
    const data = await post('/api/video/enhance-prompt', { sceneDescription: source, style: currentStyle() });
    if (!data.success) { toast(data.message || '优化失败', 'error'); return; }
    // 将优化结果写回镜头
    const update = await put('/api/video/scripts/' + currentScript.id + '/shots/' + shotId, { imagePrompt: data.data.enhancedPrompt });
    if (!update.success) { toast(update.message || '提示词保存失败', 'error'); return; }
    toast('镜头 ' + shot.shotOrder + ' 提示词已优化（图片需重新生成）', 'success');
    await loadScriptDetail(currentScript.id);
}

async function enhanceAllPrompts() {
    if (!currentScript) return;
    if (!confirm('将使用 LLM 逐个优化所有镜头的提示词（可能需要 1-2 分钟），继续？')) return;
    const btn = document.getElementById('enhanceAllBtn');
    btn.disabled = true; btn.textContent = '优化中...';
    showProgress('正在批量优化提示词（逐镜头调用 LLM，请勿关闭页面）...', true);
    const data = await post('/api/video/enhance-prompt/script/' + currentScript.id, { style: currentStyle() });
    btn.disabled = false; btn.textContent = '批量优化提示词';
    hideProgress();
    if (!data.success) { toast(data.message || '批量优化失败', 'error'); return; }
    toast(data.message || '批量优化完成', data.failed > 0 ? '' : 'success');
    await loadScriptDetail(currentScript.id);
}

// ==================== 单镜头图片生成（模块 C） ====================
async function generateShotImage(shotId) {
    const shot = findShot(shotId);
    if (!shot) return;
    const imgBox = document.getElementById('shot-image-' + shotId);
    const actions = document.querySelector('#shot-' + shotId + ' .shot-actions');
    if (imgBox) imgBox.innerHTML = '<span class="loading-spinner">生成中...</span>';
    if (actions) actions.style.opacity = '0.5';
    const data = await post('/api/video/images/shot/' + currentScript.id + '/' + shotId, { style: currentStyle() });
    if (actions) actions.style.opacity = '';
    if (!data.success) {
        if (imgBox) imgBox.innerHTML = '<span class="placeholder" style="color:#f74a4a">' + esc(data.message || '生成失败') + '</span>';
        toast(data.message || '图片生成失败', 'error');
        return;
    }
    // 更新本地状态并重渲染
    const updated = data.data;
    shot.imageUrl = updated.imageUrl;
    shot.imageFileId = updated.imageFileId;
    shot.imageStatus = updated.imageStatus;
    shot.qualityScore = updated.qualityScore;
    toast('镜头 ' + shot.shotOrder + ' 图片生成成功', 'success');
    renderScript();
}

// ==================== SSE 批量生成（模块 E：并行生成 + 实时进度） ====================
function generateAllImages() {
    if (!currentScript || batchGenerating) return;
    const pending = (currentScript.shots || []).filter(s => s.imageStatus !== 'READY');
    if (pending.length === 0) { toast('所有镜头图片均已生成', ''); return; }
    batchGenerating = true;
    setBatchButtons(true);
    showProgress('正在连接生成服务...', true);

    const url = '/api/video/images/script/' + currentScript.id + '/stream?style=' + encodeURIComponent(currentStyle());
    eventSource = new EventSource(url);

    const types = ['START', 'SHOT_START', 'SHOT_COMPLETE', 'SHOT_FAILED', 'COMPLETE', 'ERROR'];
    types.forEach(t => eventSource.addEventListener(t, e => handleSseEvent(t, JSON.parse(e.data))));
    eventSource.onerror = () => {
        // COMPLETE 后浏览器关闭连接也会触发 onerror，仅在非完成态时提示
        if (batchGenerating) {
            batchGenerating = false;
            setBatchButtons(false);
            closeSse();
            hideProgress();
            toast('生成连接中断，请重试', 'error');
        }
    };
}

function closeSse() {
    if (eventSource) { eventSource.close(); eventSource = null; }
}

function setBatchButtons(generating) {
    const g = document.getElementById('genAllBtn'); if (g) { g.disabled = generating; g.textContent = generating ? '生成中...' : '一键生成所有图片'; }
    const e = document.getElementById('enhanceAllBtn'); if (e) e.disabled = generating;
    const a = document.getElementById('addShotBtn'); if (a) a.disabled = generating;
    const pv = document.getElementById('previewBtn'); if (pv) pv.disabled = generating || !allShotsReady();
    const ex = document.getElementById('exportBtn'); if (ex) ex.disabled = generating || !allShotsReady();
}

function allShotsReady() {
    const shots = (currentScript && currentScript.shots) || [];
    return shots.length > 0 && shots.every(s => s.imageStatus === 'READY');
}

function handleSseEvent(type, p) {
    if (type === 'START') {
        showProgress('开始批量生成：共 ' + p.totalShots + ' 个镜头...', false);
        setProgress(0);
        (currentScript.shots || []).forEach(s => { s.imageStatus = 'GENERATING'; });
        renderScript();
        setBatchButtons(true);
        return;
    }
    if (type === 'SHOT_START') {
        const imgBox = document.getElementById('shot-image-' + p.shotId);
        if (imgBox) imgBox.innerHTML = '<span class="loading-spinner">生成中...</span>';
        document.getElementById('progressLabel').textContent = p.message || ('正在生成第 ' + p.currentShotIndex + ' 张...');
        return;
    }
    if (type === 'SHOT_COMPLETE') {
        const shot = findShot(p.shotId);
        if (shot) { shot.imageUrl = p.imageUrl; shot.imageStatus = 'READY'; shot.qualityScore = p.qualityScore; }
        const imgBox = document.getElementById('shot-image-' + p.shotId);
        if (imgBox && p.imageUrl) imgBox.innerHTML = '<img src="' + esc(p.imageUrl) + '">';
        const card = document.getElementById('shot-' + p.shotId);
        if (card) {
            card.classList.add('has-image');
            // 同步更新卡片状态徽章，避免等待全量重渲染
            const badge = card.querySelector('.badge');
            if (badge) { badge.className = 'badge badge-READY'; badge.textContent = 'READY'; }
            // 同步质量评分徽章（模块 J）
            const qb = document.getElementById('quality-badge-' + p.shotId);
            const qHtml = qualityBadgeHtml(p.qualityScore, p.shotId);
            if (qb) { qb.outerHTML = qHtml; }
            else if (qHtml && badge) { badge.insertAdjacentHTML('afterend', qHtml); }
        }
        updateProgressAndCount(p);
        return;
    }
    if (type === 'SHOT_FAILED') {
        const shot = findShot(p.shotId);
        if (shot) shot.imageStatus = 'FAILED';
        const imgBox = document.getElementById('shot-image-' + p.shotId);
        if (imgBox) imgBox.innerHTML = '<span class="placeholder" style="color:#f74a4a">生成失败</span>';
        updateProgressAndCount(p);
        toast(p.message || '有镜头生成失败', 'error');
        return;
    }
    if (type === 'COMPLETE') {
        batchGenerating = false;
        closeSse();
        setProgress(100);
        setTimeout(hideProgress, 800);
        setBatchButtons(false);
        renderScript(); // 重渲染徽章/按钮状态
        toast(p.message || '批量生成完成', (p.failedShots || 0) > 0 ? '' : 'success');
        loadScriptList(true);
        return;
    }
    if (type === 'ERROR') {
        batchGenerating = false;
        closeSse();
        hideProgress();
        setBatchButtons(false);
        toast(p.message || '生成服务异常', 'error');
    }
}

function updateProgressAndCount(p) {
    const total = p.totalShots || 1;
    const done = (p.completedShots || 0) + (p.failedShots || 0);
    setProgress(done / total * 100);
    const info = document.getElementById('imageCountInfo');
    if (info) info.textContent = '已生成: ' + (p.completedShots || 0) + '/' + total + ' 张图片 · 失败 ' + (p.failedShots || 0);
    const pv = document.getElementById('previewBtn'); if (pv) pv.disabled = !allShotsReady();
    const ex = document.getElementById('exportBtn'); if (ex) ex.disabled = !allShotsReady();
}

async function exportVideo(preview) {
    if (!currentScript) return;
    if (exporting) { toast('正在导出中，请稍候', 'error'); return; }
    if (!allShotsReady()) { toast('请先生成所有镜头的图片', 'error'); return; }
    const previewBtn = document.getElementById('previewBtn');
    const exportBtn = document.getElementById('exportBtn');
    const batchBtn = document.getElementById('batchExportBtn');
    const bgmId = document.getElementById('bgmSelect') ? document.getElementById('bgmSelect').value : currentBgmId;

    const body = { scriptId: currentScript.id, aspectRatio: currentAspect, bgmId: bgmId || null, subtitle: currentSubtitle, subtitleLanguage: currentSubtitleLang, withLogo: currentWithLogo, upscale: currentUpscale, interpolate: currentInterpolate, sfx: currentSfx };
    if (!preview) body.resolution = currentResolution;

    // 模块 I：选了平台预设时走平台导出（比例/分辨率由后端映射，同时校验推荐时长）
    let url;
    if (!preview && currentPlatform) {
        url = '/api/video/export/platform';
        body.platform = currentPlatform;
        delete body.aspectRatio;
        delete body.resolution;
    } else {
        url = preview ? '/api/video/export/preview' : '/api/video/export/hd';
    }

    const platformName = currentPlatform ? (platformList.find(function(p) { return p.name === currentPlatform; }) || {}).displayName : '';

    exporting = true;
    if (previewBtn) { previewBtn.disabled = true; previewBtn.textContent = '生成中...'; }
    if (exportBtn) { exportBtn.disabled = true; exportBtn.textContent = '生成中...'; }
    if (batchBtn) batchBtn.disabled = true;
    showProgress(preview
        ? '正在生成 480p 快速预览（低分辨率 + 水印，快速确认效果）...'
        : (currentPlatform
            ? '正在按「' + esc(platformName) + '」平台规格导出 1080p 视频（可能需要 1-5 分钟）...'
            : '正在导出高清视频（' + currentResolution + ' ' + currentAspect + '，可能需要 1-5 分钟）...'), true);

    const data = await post(url, body);

    exporting = false;
    if (previewBtn) { previewBtn.disabled = false; previewBtn.textContent = '快速预览(480p)'; }
    if (exportBtn) { exportBtn.disabled = false; exportBtn.textContent = '高清导出'; }
    if (batchBtn) batchBtn.disabled = false;
    hideProgress();

    if (!data.success) {
        toast(data.message || '导出失败', 'error');
        if (currentScript && currentScript.id === body.scriptId) loadExportHistory();
        return;
    }
    // 导出期间用户可能已切换脚本，仅当仍在原脚本页时才展示结果与历史
    if (currentScript && currentScript.id === body.scriptId) {
        renderVideoResult(data.data.video, data.data);
        loadExportHistory();
    }
    loadScriptList(true); // 高清导出后脚本状态变为 EXPORTED，刷新列表徽章
    toast(preview ? '预览生成完成，确认效果后可高清导出' : '高清导出完成', 'success');
    if (data.data && data.data.durationWarning) toast(data.data.durationWarning, 'error');
}

function renderVideoResult(video, exportInfo) {
    let a = document.getElementById('videoResultArea');
    if (!a) return;
    let tags = [];
    tags.push(video.width + 'x' + video.height);
    tags.push(video.totalDuration + 's');
    if (video.hasNarration) tags.push('含旁白配音');
    if (video.hasBgm && exportInfo) tags.push('BGM: ' + esc(exportInfo.bgmName || ''));
    if (video.hasSfx) tags.push('含环境音效');
    if (video.hasEnhance) tags.push('超分/补帧增强');
    if (video.hasSubtitle) tags.push('含烧录字幕');
    if (video.hasLogo) tags.push('含Logo');
    if (exportInfo && exportInfo.platform) tags.push('平台: ' + esc(exportInfo.platform.displayName));
    if (exportInfo && exportInfo.hasWatermark) tags.push('<span class="badge badge-PENDING">预览版·带水印</span>');
    if (video.fileSizeBytes) tags.push((video.fileSizeBytes / 1048576).toFixed(1) + ' MB');
    a.innerHTML = '<div class="video-result"><h3>' + (exportInfo && exportInfo.hasWatermark ? '快速预览完成' : (exportInfo && exportInfo.platform ? esc(exportInfo.platform.displayName) + ' 平台导出完成' : '高清导出完成')) + '</h3>' +
        '<video controls autoplay src="' + esc(video.videoUrl) + '">您的浏览器不支持视频播放</video><br>' +
        '<a class="download-link" href="' + esc(video.videoUrl) + '" download>下载视频</a>' +
        '<button class="btn btn-sm btn-ghost" onclick="generateCover(' + (exportInfo ? exportInfo.id : 'null') + ')">生成封面</button>' +
        '<div class="meta-tags">' + tags.join(' | ') + '</div></div>';
    a.scrollIntoView({ behavior: 'smooth' });
}

async function batchExport() {
    if (!currentScript) return;
    if (exporting) { toast('正在导出中，请稍候', 'error'); return; }
    if (!allShotsReady()) { toast('请先生成所有镜头的图片', 'error'); return; }
    const bgmId = document.getElementById('bgmSelect') ? document.getElementById('bgmSelect').value : currentBgmId;
    const platforms = ['DOUYIN', 'BILIBILI', 'XIAOHONGSHU'];

    exporting = true;
    const previewBtn = document.getElementById('previewBtn');
    const exportBtn = document.getElementById('exportBtn');
    const batchBtn = document.getElementById('batchExportBtn');
    if (previewBtn) previewBtn.disabled = true;
    if (exportBtn) exportBtn.disabled = true;
    if (batchBtn) { batchBtn.disabled = true; batchBtn.textContent = '导出中...'; }
    showProgress('正在并行导出 抖音(9:16) / B站(16:9) / 小红书(1:1) 三个 1080p 版本（可能需要数分钟）...', true);

    const body = { scriptId: currentScript.id, bgmId: bgmId || null, subtitle: currentSubtitle, subtitleLanguage: currentSubtitleLang, withLogo: currentWithLogo };
    const results = await Promise.allSettled(platforms.map(function(p) {
        return post('/api/video/export/platform', Object.assign({}, body, { platform: p }));
    }));

    exporting = false;
    if (previewBtn) previewBtn.disabled = false;
    if (exportBtn) exportBtn.disabled = false;
    if (batchBtn) { batchBtn.disabled = false; batchBtn.textContent = '批量三平台'; }
    hideProgress();

    const nameOf = function(p) { const x = platformList.find(function(i) { return i.name === p; }); return x ? x.displayName : p; };
    let okCount = 0;
    const okIds = [];
    let h = '<div class="export-history"><h3>批量导出结果</h3>';
    results.forEach(function(r, i) {
        const p = platforms[i];
        h += '<div class="export-item">';
        if (r.status === 'fulfilled' && r.value.success) {
            okCount++;
            const d = r.value.data;
            okIds.push(d.id);
            h += '<span class="badge badge-EXPORTED">' + esc(nameOf(p)) + '</span>';
            h += '<span>' + d.video.totalDuration + 's' + (d.video.fileSizeBytes ? ' · ' + (d.video.fileSizeBytes / 1048576).toFixed(1) + ' MB' : '') + '</span>';
            if (d.durationWarning) h += '<span class="failed-text">' + esc(d.durationWarning) + '</span>';

            h += '<button class="btn btn-sm btn-ghost" onclick="generateCover(' + d.id + ')">封面</button>';
        } else {
            const msg = r.status === 'fulfilled' ? ((r.value && r.value.message) || '导出失败') : '请求异常';
            h += '<span class="badge badge-FAILED">' + esc(nameOf(p)) + '</span><span class="failed-text">' + esc(msg) + '</span>';
        }
        h += '</div>';
    });
    if (okIds.length) {
        h += '<div class="export-item"><button class="btn btn-sm" onclick="downloadBatchZip([' + okIds.join(',') + '])" title="将本次批量导出的视频（含已生成封面）打包为 ZIP 下载">打包下载 ZIP（' + okIds.length + ' 个视频）</button></div>';
    }
    h += '</div>';
    const area = document.getElementById('videoResultArea');
    if (area) { area.innerHTML = h; area.scrollIntoView({ behavior: 'smooth' }); }
    loadExportHistory();
    loadScriptList(true);
    toast('批量导出完成：成功 ' + okCount + '/' + platforms.length + '，可在导出历史中下载各版本', okCount === platforms.length ? 'success' : 'error');

// 批量打包下载（模块 I）：将选中导出记录的视频+封面打包为 ZIP
async function downloadBatchZip(ids) {
    if (!ids || !ids.length) { toast('没有可打包的导出记录', 'error'); return; }
    toast('正在打包 ' + ids.length + ' 个视频（含封面），请稍候...', '');
    try {
        const resp = await fetch('/api/video/export/batch-download', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ exportIds: ids })
        });
        if (!resp.ok) {
            const err = await resp.json().catch(function() { return { message: 'HTTP ' + resp.status }; });
            toast(err.message || '打包下载失败', 'error'); return;
        }
        const blob = await resp.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'video_exports_' + Date.now() + '.zip';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
        toast('打包下载完成（' + (blob.size / 1048576).toFixed(1) + ' MB）', 'success');
    } catch (e) {
        toast('打包下载失败: ' + e.message, 'error');
    }
}

// ==================== AI 导演（Phase 3 切片2） ====================
let agentSessionId = null;   // 导演会话ID（服务端生成，内存态历史）
let agentLastMessage = '';   // 最近一次用户消息（确认重发用）
let agentBusy = false;       // 是否正在等待导演回复

function appendAgentLog(role, text) {
    const log = document.getElementById('agentLog');
    const color = role === 'user' ? '#4a6cf7' : (role === 'error' ? '#f74a4a' : '#2ecc71');
    log.innerHTML += '<div style="margin-bottom:6px"><b style="color:' + color + '">' +
        (role === 'user' ? '我' : (role === 'error' ? '错误' : '导演')) + '：</b>' + esc(text) + '</div>';
    log.scrollTop = log.scrollHeight;
}

async function sendAgentMessage(confirmedTools) {
    const input = document.getElementById('agentInput');
    const msg = confirmedTools ? agentLastMessage : input.value.trim();
    if (!msg || agentBusy) return;
    agentLastMessage = msg;
    if (!confirmedTools) { input.value = ''; appendAgentLog('user', msg); }
    agentBusy = true;
    document.getElementById('agentSendBtn').disabled = true;
    document.getElementById('agentConfirmBar').style.display = 'none';
    appendAgentLog('director', '思考中...');
    try {
        const body = { message: msg, sessionId: agentSessionId };
        if (confirmedTools) body.confirmedTools = confirmedTools;
        const data = await post('/api/video/agent/chat', body);
        const log = document.getElementById('agentLog');
        log.removeChild(log.lastChild); // 移除“思考中”
        if (!data.success) { appendAgentLog('error', data.message || '对话失败'); return; }
        agentSessionId = data.data.sessionId;
        appendAgentLog('director', data.data.reply || '(无回复)');
        const pending = data.data.pendingConfirmations || [];
        if (pending.length > 0) {
            const bar = document.getElementById('agentConfirmBar');
            bar.innerHTML = '';
            pending.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-orange btn-sm';
                btn.textContent = '确认执行 ' + p.tool;
                btn.onclick = () => sendAgentMessage([p.tool]);
                bar.appendChild(btn);
            });
            bar.style.display = 'block';
        }
        loadScriptList(true); // 工具可能新建了脚本，刷新列表
    } finally {
        agentBusy = false;
        document.getElementById('agentSendBtn').disabled = false;
    }
}

async function clearAgentChat() {
    if (agentSessionId) await api('/api/video/agent/chat/' + agentSessionId, { method: 'DELETE' });
    agentSessionId = null;
    document.getElementById('agentLog').innerHTML = '';
    document.getElementById('agentConfirmBar').style.display = 'none';
}

// ==================== 一键流水线（Phase 3 切片3：多 Agent 异步编排） ====================
let agentPipelineTaskId = null; // 编排任务ID
let agentPipelineTimer = null;  // 轮询定时器

async function startAgentPipeline() {
    const idea = document.getElementById('agentInput').value.trim();
    if (!idea) { toast('请先在输入框填写创意想法', 'error'); return; }
    if (agentPipelineTimer) { toast('已有流水线在运行', 'error'); return; }
    document.getElementById('agentInput').value = '';
    appendAgentLog('user', '[一键流水线] ' + idea);
    const data = await post('/api/video/agent/orchestrate', { idea: idea });
    if (!data.success) { appendAgentLog('error', data.message || '提交失败'); return; }
    agentPipelineTaskId = data.data.taskId;
    appendAgentLog('director', '流水线已提交（任务 ' + agentPipelineTaskId.slice(0, 8) + '…），后台执行中…');
    document.getElementById('agentPipelineBtn').disabled = true;
    agentPipelineTimer = setInterval(pollAgentPipeline, 3000);
}

async function pollAgentPipeline() {
    if (!agentPipelineTaskId) return;
    const data = await api('/api/video/agent/orchestrate/' + agentPipelineTaskId);
    if (!data.success) { stopAgentPipeline(); appendAgentLog('error', data.message || '查询失败'); return; }
    const t = data.data;
    if (t.status === 'RUNNING') return; // 继续轮询
    stopAgentPipeline();
    if (t.status === 'FAILED') { appendAgentLog('error', '流水线失败：' + (t.error || '未知原因')); return; }
    appendAgentLog('director', t.reply || '(无回复)');
    if (t.status === 'AWAITING_CONFIRMATION') {
        const bar = document.getElementById('agentConfirmBar');
        bar.innerHTML = '';
        (t.pendingConfirmations || []).forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-orange btn-sm';
            btn.textContent = '确认执行 ' + p.tool;
            btn.onclick = () => confirmAgentPipeline();
            bar.appendChild(btn);
        });
        bar.style.display = 'block';
    }
    loadScriptList(true);
}

async function confirmAgentPipeline() {
    document.getElementById('agentConfirmBar').style.display = 'none';
    const data = await post('/api/video/agent/orchestrate/' + agentPipelineTaskId + '/confirm', {});
    if (!data.success) { appendAgentLog('error', data.message || '确认失败'); return; }
    appendAgentLog('director', '已确认，继续执行…');
    document.getElementById('agentPipelineBtn').disabled = true;
    agentPipelineTimer = setInterval(pollAgentPipeline, 3000);
}

function stopAgentPipeline() {
    if (agentPipelineTimer) { clearInterval(agentPipelineTimer); agentPipelineTimer = null; }
    document.getElementById('agentPipelineBtn').disabled = false;
}

// Ctrl+Enter 快捷生成
document.getElementById('ideaInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateScript();
});

// ==================== 视频转绘（Phase 4 切片 5） ====================
let restyleTimer = null;

async function submitRestyle() {
    const fileInput = document.getElementById('restyleFile');
    if (!fileInput.files || !fileInput.files.length) { toast('请先选择视频文件（mp4/mov，2-10 秒）', 'error'); return; }
    const fd = new FormData();
    fd.append('file', fileInput.files[0]);
    fd.append('style', document.getElementById('restyleStyle').value);
    const btn = document.getElementById('restyleSubmitBtn');
    btn.disabled = true;
    const data = await api('/api/video/restyle', { method: 'POST', body: fd });
    btn.disabled = false;
    if (!data.success) { toast(data.message || '转绘提交失败', 'error'); return; }
    toast('转绘任务已提交，轮询进度中…', 'success');
    fileInput.value = '';
    await loadRestyleTasks();
}

async function loadRestyleTasks() {
    const data = await api('/api/video/restyle');
    const area = document.getElementById('restyleList');
    if (!area) return;
    if (!data.success) { area.innerHTML = '<div class="status error">' + esc(data.message || '加载失败') + '</div>'; return; }
    const tasks = data.data || [];
    let h = '';
    tasks.forEach(function(t) {
        h += '<div class="export-item" style="display:block;margin-bottom:8px">';
        h += '<span class="badge badge-' + esc(t.status) + '">' + esc(t.status) + '</span> ';
        h += '<span style="font-size:12px;color:#888">#' + t.id + ' · ' + esc(t.stylePrompt || '') + '</span>';
        if (t.status === 'SUCCEEDED' && t.resultUrl) {
            h += '<video src="' + esc(t.resultUrl) + '" controls style="width:100%;max-height:240px;margin-top:6px;border-radius:8px"></video>';
            h += '<div><a class="download-link" href="' + esc(t.resultUrl) + '" download>下载转绘结果</a></div>';
        }
        if (t.status === 'FAILED') h += '<div class="failed-text" style="font-size:12px;margin-top:4px">' + esc(t.error || '未知错误') + '</div>';
        h += '</div>';
    });
    area.innerHTML = h || '<div style="font-size:12px;color:#888">暂无转绘任务</div>';
    // 仅当存在未终态任务时轮询，终态清除（idiom 同编排轮询）
    const running = tasks.some(function(t) { return t.status === 'RUNNING' || t.status === 'PENDING'; });
    if (running && !restyleTimer) restyleTimer = setInterval(loadRestyleTasks, 3000);
    if (!running && restyleTimer) { clearInterval(restyleTimer); restyleTimer = null; }
}
</script>
