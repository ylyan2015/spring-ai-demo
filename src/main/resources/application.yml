server:
  port: 8080

spring:
  profiles:
    active: deepseek,openai,h2  # 默认使用DeepSeek + H2数据库，可改为 ollama,h2 使用离线模式
  
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b-instruct
      embedding:
        model: nomic-embed-text  # RAG embedding 模型（需先 ollama pull nomic-embed-text）
    
    # OpenAI 配置（仅用于通用配置 ，实际 Base URL 、API Key 等在单独配置文件中指定）
    openai:
      rest-template:
        connect-timeout: 5000
        read-timeout: 10000

    # 阿里云百炼 DashScope 配置（图像生成：通义万相 wan2.6-t2i，通过 HTTP API 调用）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

  # JPA Configuration (通用配置)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  # Multipart 文件上传配置（RAG 知识库）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers
  endpoint:
    health:
      show-details: when-authorized

# Chat Configuration
chat:
  max-context-messages: 10  # 保留最近10轮对话作为上下文

# RAG 配置
rag:
  embedding-model: ollama  # embedding 提供者: ollama（本地免费）或 openai（需有有效的API Key）
  store-type: memory       # 向量存储模式: memory（内存，测试/开发用，重启清空）或 pgvector（持久化，生产用，需postgresql profile）

# 图像生成配置（模块 C：AI 图像生成系统）
image:
  generator: dashscope               # 图像生成源：dashscope（云端通义万相）/ local（本地 SD/FLUX）
  local:                               # 本地 Stable Diffusion WebUI / ComfyUI / OllamaDiffuser 配置
    base-url: http://127.0.0.1:7860    # 本地服务 API 地址
    model: stable-diffusion            # 本地模型名称
    steps: 25                          # 采样步数
    cfg-scale: 7.0                     # 提示词相关性（CFG）
    timeout: 120                       # 本地生成超时（秒）
    style-prefix: ""                   # 风格前缀覆盖（留空时按模型名自动套用内置预设：SD1.5/SDXL/FLUX）
    extra-negative-prompt: ""          # 负面提示词覆盖（留空时按模型名自动套用内置预设）
  generation:
    parallelism: 3                     # 并行生成数（避免云端 API 限流）
    retry-attempts: 1                 # 失败重试次数
    retry-delay-ms: 2000              # 重试间隔（毫秒）
    total-timeout-seconds: 300        # 批量生成总超时（秒）；单张超时由 HTTP 客户端层控制（DashScope 60s / image.local.timeout）
    default-size: 1280x720           # 默认图片尺寸（16:9 横屏）
  quality:                             # 模块 J：图片质量评估（多模态 LLM 打分 + 低分自动重试）
    enabled: false                     # 是否启用质量评估（关闭时生成流程完全不变）
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1  # OpenAI 兼容多模态端点
    api-key: ${DASHSCOPE_API_KEY:}     # 多模态 API Key（留空时降级为规则评估：分辨率启发式）
    model: qwen-vl-max                 # 多模态评估模型
    threshold: 6.0                     # 及格阈值（0-10），低于该分自动重新生成
    max-retries: 2                     # 低分图片最大重试次数（始终保留得分最高的一张）

# Agent 工具配置（Phase 3）
agent:
  tools:
    self-base-url: http://localhost:8080  # 本服务访问基址：evaluateImage 工具仅接受存储相对路径（/images/…），
                                          # 解析为同源绝对 URL（SSRF 防护）；部署时按实际对外地址修改

# 视频合成与导出（模块 C：预览/导出；模块 D：BGM）
video:
  # FFmpeg / ffprobe 可执行文件位置。Windows 下建议写绝对路径，避免依赖系统 PATH；
  # xfade 转场需要 FFmpeg ≥ 4.3，EVCapture 等软件自带的旧版（≈4.2）不含 xfade，不可用。
  ffmpeg-path: ${FFMPEG_PATH:D:/Program Files/ffmpeg/bin/ffmpeg.exe}
  ffprobe-path: ${FFPROBE_PATH:D:/Program Files/ffmpeg/bin/ffprobe.exe}
  # 运行 edge-tts 的 Python 解释器。本机 PATH 上的裸 python 会被微软商店的"应用执行别名"桩
  # 抢先命中并返回退出码 49，因此这里写绝对路径（pip install edge-tts 已装到该解释器的用户目录）
  python-command: ${PYTHON_CMD:C:/Users/Yan Yulin/AppData/Local/Python/bin/python.exe}
  compose-timeout-minutes: 8        # 单次 FFmpeg 命令超时（分钟）；1080p 多镜头合成较慢，建议 ≥8
  watermark:                        # 模块 I：品牌水印
    logo-path: ""                    # Logo 角标图片路径（透明底 PNG，建议宽 ≤300px，叠在右下角；留空禁用）
  subtitle:                          # 模块 F：字幕烧录
    font-name: Microsoft YaHei       # 字幕字体（需系统已安装；Linux/Docker 可用 Source Han Sans CN / Noto Sans CJK SC）

# 背景音乐库配置（模块 D：BGM）
bgm:
  library-path: ./data/bgm          # 内置音乐库目录；文件名格式 category__name.mp3（如 happy__sunny_morning.mp3），
                                    # 分类: happy / sad / epic / calm / tense，启动时自动扫描注册
                                    # 用户上传的音乐保存在该目录的 uploads/ 子目录下

# 存储配置（图像生成后的文件存储方式）
storage:
  type: local               # 存储类型：local（本地）/ oss（阿里云OSS）/ minio（MinIO）/ fastdfs（FastDFS）
  local:
    base-path: ./uploads     # 本地文件存储根目录
    access-path: /images     # 本地文件访问路径前缀
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY:}
    access-key-secret: ${OSS_SECRET:}
    bucket-name: ${OSS_BUCKET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET:}
    bucket-name: ${MINIO_BUCKET:ai-images}
  fastdfs:
    tracker-servers: ${FASTDFS_TRACKER:}
    web-server-url: ${FASTDFS_WEB_URL:}
