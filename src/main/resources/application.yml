server:
  port: 8080

spring:
  profiles:
    active: deepseek,openai,h2  # 默认使用DeepSeek + H2数据库，可改为 ollama,h2 使用离线模式
  
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b-instruct
    
    # OpenAI 配置（仅用于通用配置 ，实际 Base URL 、API Key 等在单独配置文件中指定）
    openai:
      rest-template:
        connect-timeout: 5000
        read-timeout: 10000
  # JPA Configuration (通用配置)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Chat Configuration
chat:
  max-context-messages: 10  # 保留最近10轮对话作为上下文
