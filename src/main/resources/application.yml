server:
  port: 8080

spring:
  profiles:
    active: deepseek,h2  # 默认使用DeepSeek + H2数据库，可改为 ollama,h2 使用离线模式
  
  ai:
    # 模型类型开关（Spring AI 1.0.0）：在线 chat 由 ModelService 按提供者自建 OpenAI 兼容客户端，
    # 不依赖 OpenAI 自动配置 Bean；关闭未使用的 OpenAI 音频/图像/ moderation，
    # 避免干净环境（无 OPENAI_API_KEY）下自动配置 Bean 校验 Key 导致启动失败
    model:
      chat: ollama          # 保留 Ollama ChatModel Bean 供离线模式；在线模式走 ModelService 自建客户端
      embedding: ollama     # RAG 默认本地向量化；openai/dashscope 提供者由 AiModelConfig 自建客户端
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b-instruct
      embedding:
        model: nomic-embed-text  # RAG embedding 模型（需先 ollama pull nomic-embed-text）
    
    # OpenAI 配置（仅用于通用配置 ，实际 Base URL 、API Key 等在单独配置文件中指定）
    openai:
      rest-template:
        connect-timeout: 5000
        read-timeout: 10000

    # 阿里云百炼 DashScope 配置（图像生成：通义万相 wan2.6-t2i，通过 HTTP API 调用）
    dashscope:
      # 真实 Key 一律经环境变量 DASHSCOPE_API_KEY 注入（本文件 git 跟踪，禁止写入真实 Key）
      api-key: ${DASHSCOPE_API_KEY:}

  # JPA Configuration (通用配置)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  # Multipart 文件上传配置（RAG 知识库 + Phase 4 切片 5 转绘视频≤100MB）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Actuator 监控配置（release 审查 M7：仅暴露 health/info，env/loggers 等敏感端点不对外）
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Chat Configuration
chat:
  max-context-messages: 10  # 保留最近10轮对话作为上下文

# RAG 配置
rag:
  embedding-model: ollama  # embedding 提供者: ollama（本地免费）/ openai / dashscope（通义云端，需 DASHSCOPE_API_KEY）；配置+重启生效
  store-type: memory       # 向量存储模式: memory（内存，测试/开发用，重启清空）或 pgvector（持久化，生产用，需postgresql profile）
  # 云端向量化（DashScope 通义，OpenAI 兼容端点）：DeepSeek 官方不提供 embedding API，
  # 在线模式不想依赖本地 Ollama 时将 embedding-model 改为 dashscope。
  # 注意：不同提供者的向量语义空间不兼容，切换后需清空旧向量重新上传文档；
  # dimensions 须与 rag.pgvector.dimensions 一致（pgvector 模式）
  dashscope:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: text-embedding-v4
    dimensions: 768

# 图像生成配置（模块 C：AI 图像生成系统）
image:
  generator: dashscope               # 图像生成源：dashscope（默认）/ local / zhipu / siliconflow / openai / ark / comfyui；前端下拉可运行时切换
  # OpenAI 兼容 images/generations 协议提供者（一个通用实现覆盖四家）：
  # Key 经环境变量注入，空 Key 时该提供者在前端显示不可用；
  # fixed-sizes 为受支持尺寸枚举（按宽高比就近映射），留空 = 任意尺寸透传；
  # 协议无 negative_prompt 参数，负面词自动拼接进 prompt
  compat:
    zhipu:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY:}
      model: cogview-3-flash          # 免费档；付费高质量可改 cogview-4
      fixed-sizes: 1024x1024,1344x768,768x1344,1152x864,864x1152,1440x720,720x1440
    siliconflow:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${SILICONFLOW_API_KEY:}
      model: Kwai-Kolors/Kolors       # 免费档；或 black-forest-labs/FLUX.1-schnell
      fixed-sizes: ""
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: gpt-image-1
      fixed-sizes: 1024x1024,1536x1024,1024x1536
    ark:
      base-url: https://ark.cn-beijing.volces.com/api/v3
      api-key: ${ARK_API_KEY:}
      model: doubao-seedream-4-0-250828   # 中文语义/文字渲染强；或 4-5/5-0 版本
      fixed-sizes: ""
  local:                               # 本地 Stable Diffusion WebUI / ComfyUI / OllamaDiffuser 配置
    base-url: http://127.0.0.1:7860    # 本地服务 API 地址
    model: stable-diffusion            # 本地模型名称
    steps: 25                          # 采样步数
    cfg-scale: 7.0                     # 提示词相关性（CFG）
    timeout: 120                       # 本地生成超时（秒）
    style-prefix: ""                   # 风格前缀覆盖（留空时按模型名自动套用内置预设：SD1.5/SDXL/FLUX）
    extra-negative-prompt: ""          # 负面提示词覆盖（留空时按模型名自动套用内置预设）
  comfyui:                             # Phase 5 切片 3：本地 ComfyUI SD1.5+LoRA 分镜（实测 ~8s/张，手册 §6）
    workflow-plain: ${COMFYUI_IMG_PLAIN:docs/comfyui/sd15_storyboard.template.json}
    workflow-lora: ${COMFYUI_IMG_LORA:docs/comfyui/sd15_lora_storyboard.template.json}
    workflow-canny: ${COMFYUI_IMG_CANNY:docs/comfyui/sd15_lora_canny.template.json}
    workflow-ipadapter: ${COMFYUI_IMG_IPADAPTER:docs/comfyui/sd15_ipadapter.template.json}
    workflow-ipadapter-lora: ${COMFYUI_IMG_IPADAPTER_LORA:docs/comfyui/sd15_ipadapter_lora.template.json}
    ipadapter-weight: 0.7              # IP-Adapter 参考强度（行业甜点区 0.65-0.85；过高会把参考图抄成贴图）
    controlnet-enabled: false          # 开启后角色定妆参考图经 canny 锁机位（+~10s/张，手册 §4）
    timeout-seconds: 120               # 单张实测 7-9s；120s 余量含模型加载
    poll-interval-ms: 1000
  generation:
    parallelism: 3                     # 并行生成数（避免云端 API 限流）
    retry-attempts: 1                 # 失败重试次数
    retry-delay-ms: 2000              # 重试间隔（毫秒）
    total-timeout-seconds: 300        # 批量生成总超时（秒）；单张超时由 HTTP 客户端层控制（DashScope 60s / image.local.timeout）
    default-size: 1280x720           # 默认图片尺寸（16:9 横屏）；脚本画幅 9:16 时自动切 720x1280（P0-3 竖屏优先，单镜/批量/尾卡/抽卡同源）
  quality:                             # 模块 J：图片质量评估（多模态 LLM 打分 + 低分自动重试）
    enabled: false                     # 是否启用质量评估（关闭时生成流程完全不变）
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1  # OpenAI 兼容多模态端点
    api-key: ${DASHSCOPE_API_KEY:}     # 多模态 API Key（留空时降级为规则评估：分辨率启发式）
    model: qwen-vl-max                 # 多模态评估模型
    threshold: 6.0                     # 及格阈值（0-10），低于该分自动重新生成
    max-retries: 2                     # 低分图片最大重试次数（始终保留得分最高的一张）

# Agent 工具配置（Phase 3）
agent:
  tools:
    self-base-url: http://localhost:8080  # 本服务访问基址：evaluateImage 工具仅接受存储相对路径（/images/…），
                                          # 解析为同源绝对 URL（SSRF 防护）；部署时按实际对外地址修改

# 视频合成与导出（模块 C：预览/导出；模块 D：BGM）
video:
  script:                            # 生成-评价-生成自我精修（2026-11-18）：四人评审团（导演/编剧/画师/乐师）质疑后重修
    refine-rounds: 2                 # 精修轮数（0=关闭；每轮 +2 次 LLM 调用，总耗时与 token 约为直出 3-5 倍）
    model: ${VIDEO_SCRIPT_MODEL:deepseek-v4-pro}   # 脚本生成专用模型（仅 deepseek profile 生效；空=跟随全局 chat 模型；省钱可换 deepseek-flash）
    read-timeout-seconds: 300        # 思考模式（v4 系默认开启）单次调用读超时；长 JSON 输出 120s 会顶红线
    client-timeout-ms: 900000        # 前端工作台等待预算（video-studio.html postLong AbortController）；需覆盖 2 轮精修实测 ≈13 分钟
  # Phase 4 切片 2：图生视频生成源 none（默认，静图运镜回退）/ dashscope-wan；kling/seedance 预留未实现
  generator: ${VIDEO_GENERATOR:none}
  workers: 2                          # i2v 并行工作线程数（云端限流+成本控）；comfyui 本地路线建议 1（单卡无并行收益；workers=2 第二单队列等待 +≈226s/49f）
  retry-attempts: 1                   # i2v 失败重试次数（按秒计费，成本红线）
  candidates:                         # Phase 4 切片 3：抽卡候选数（成本敏感可降 1；一键编排不抽卡）
    image-count: 3
    video-count: 2
  wan:
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
    model: ${VIDEO_WAN_MODEL:wan2.7-i2v}   # wan2.7-i2v 首尾帧 / wan2.6-i2v 仅首帧
    resolution: 720P                  # 成本基线：720P/5s/中低运动幅度
    timeout-seconds: 600
    poll-interval-ms: 5000
  comfyui:                            # Phase 5 切片 1：本地 ComfyUI i2v（零成本路线，docs/local-generation-feasibility.md）
    base-url: ${COMFYUI_BASE_URL:http://127.0.0.1:8188}
    workflow-path: ${COMFYUI_WORKFLOW:docs/comfyui/wan22_i2v_5b.template.json}  # 占位符模板；Phase 0 从 ComfyUI 导出校准后覆盖
    fps: 24                           # Wan2.2 5B 原生 24fps；帧数自动对齐 4n+1
    timeout-seconds: 2700             # 上调自 1800（2026-11-17 用户拍板）：实测 8s 镜 193f ~25min、9s 镜 217f ~31min 顶红线；基线 49f≈226s/边际5.1s帧
    poll-interval-ms: 3000
  # FFmpeg / ffprobe 可执行文件位置。默认裸名走系统 PATH（release 审查 M10：可移植）；
  # 不在 PATH 时用环境变量 FFMPEG_PATH / FFPROBE_PATH 指定绝对路径。
  # xfade 转场需要 FFmpeg ≥ 4.3，EVCapture 等软件自带的旧版（≈4.2）不含 xfade，不可用。
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  ffprobe-path: ${FFPROBE_PATH:ffprobe}
  # 运行 edge-tts 的 Python 解释器。默认裸名走 PATH；Windows 注意避开微软商店的
  # "应用执行别名"桩（返回退出码 49），必要时用环境变量 PYTHON_CMD 指定真实解释器绝对路径
  python-command: ${PYTHON_CMD:python}
  tts:                                # 旁白/对白声线与语速（edge-tts 的 rate 偏移）
    # 实测 2026-11-17（同一批 GTA6 文本，261 字旁白 / 47 字对白，ffprobe 取时长）：
    #   YunyangNeural +0% 4.78 字/秒 | +15% 5.49 | +25% 5.97 | +40% 6.69
    #   YunxiNeural   +0% 4.45 字/秒 | +15% 5.12 | +25% 5.56
    # 台词算术的分母就是这个数：镜头时长 ≥ 字数/字每秒 + 0.6s。改语速后重算全片，别只改这里。
    narration-voice: ${TTS_NARRATION_VOICE:zh-CN-YunyangNeural}   # 纪录片男声；此前脚本里的 narrationVoice 字段工作台未读取
    narration-rate: ${TTS_NARRATION_RATE:+15%}                    # 旁白提速档；情绪顶点想留重量可回 +0%
    dialogue-rate: ${TTS_DIALOGUE_RATE:+0%}                       # 内心话不比旁白快，快了就变成报幕
  compose-timeout-minutes: 8        # 单次 FFmpeg 命令超时（分钟）；1080p 多镜头合成较慢，建议 ≥8
  motion:                            # 静图运镜动效（镜头运动字段生效：固定=静态/推/拉/平移）
    zoom-amount: 0.06                # 缩放幅度（占画面比例）；越小画面越稳
    supersample-factor: 4            # zoompan 超采样倍数上限（消抖）；按分辨率自适应封顶中间长边≤3840：1080p→2×/720p→3×/480p→4×；1=关闭
  watermark:                        # 模块 I：品牌水印
    logo-path: ""                    # Logo 角标图片路径（透明底 PNG，建议宽 ≤300px，叠在右下角；留空禁用）
  subtitle:                          # 模块 F：字幕烧录
    font-name: Microsoft YaHei       # 字幕字体（需系统已安装；Linux/Docker 可用 Source Han Sans CN / Noto Sans CJK SC）
  commentary:                        # Phase 5 Track B：评论杂谈自动化（评论工作台 /commentary-studio）
    max-insert-ratio: 0.2            # 引用占比上限（引用镜时长/总时长；超限拒绝导出，版权护栏）
    attribution-font: ""             # 出处水印字体文件（空=不带 fontfile；中文渲染需配置如 C:/Windows/Fonts/msyh.ttc，B0 教训）
    import-dir: ""                   # Task 6：批量入库扫描目录（空=禁用；仅读配置目录防遍历；文件名约定 epNN_标签_名称.mp4/png）
  assets:                            # 素材库增强（2026-11-17 spec S1）：参考素材扫描目录
    reference-import-dir: ""         # 空=禁用；文件名约定 char_角色名_描述.png / scene_场景名_描述.jpg（png/jpg/jpeg/webp）；POST /api/video/assets/scan-reference 触发
    booru:                             # S4 网搜入库（spec §4.2 三道闸）：GET/POST /api/video/assets/booru/*
      allowed-hosts: safebooru.org,safebooru.donmai.us,cdn.donmai.us   # 图片 host 白名单（Task 12 实测：donmai 系图片不在 API 同域，而在 cdn.donmai.us 子域）；与 DanbooruSafeProvider 的注册域早筛同步放宽，只改一侧等于没改；非空项才生效，逗号后可带空格
      default-provider: safebooru                        # provider 参数缺省时的主源：safebooru / danbooru-safe
  endcard:                           # Phase 5 Track A：尾卡镜（endCard=true 跳过生图，纯色底+FFmpeg 压字本地渲染）
    font: C:/Windows/Fonts/msyh.ttc  # 压字字体（中文必须 fontfile，B0 教训；Linux/Docker 换 Noto Sans CJK）
    color: black                     # 底色（lavfi color 表达式）
  # Phase 4 切片 4：导出后期增强（默认全关；工具未配置/执行失败时自动跳过不阻断导出）
  sfx:
    enabled: false                   # 音效推荐混音总开关（开启后导出勾选“音效”才生效；库见 sfx.library-path）
  realesrgan-path: ""                # Real-ESRGAN ncnn-vulkan 可执行绝对路径（空=跳过超分；下载见 ncnn-vulkan release）
  realesrgan-model: realesrgan-x4plus-anime  # 超分模型名（动漫风格推荐 x4plus-anime）
  rife-path: ""                      # RIFE ncnn-vulkan 可执行绝对路径（空=跳过补帧；依赖超分抽帧链）
  rife-model: ""                     # RIFE 模型目录（如 rife-v4.6）
  restyle:                           # Phase 4 切片 5：视频转绘（独立输出模式，复用 DASHSCOPE_API_KEY，空 Key 不可用）
    model: wan2.7-videoedit          # 转绘模型（spike 实测：纯指令风格编辑，输入 mp4/mov 2-10s）
    timeout-seconds: 600
    poll-interval-ms: 5000

# 音效库配置（Phase 4 切片 4：分层混音，预置生成见 tools/generate-preset-sfx.ps1）
sfx:
  library-path: ./data/sfx          # 音效库目录；文件名格式 category__name.mp3，
                                    # 分类: wind / rain / footsteps / heartbeat，启动时自动扫描注册

# 背景音乐库配置（模块 D：BGM）
bgm:
  library-path: ./data/bgm          # 内置音乐库目录；文件名格式 category__name.mp3（如 happy__sunny_morning.mp3），
                                    # 分类: happy / sad / epic / calm / tense，启动时自动扫描注册
                                    # 用户上传的音乐保存在该目录的 uploads/ 子目录下

# 存储配置（图像生成后的文件存储方式）
storage:
  type: local               # 存储类型：local（本地）/ oss（阿里云OSS）/ minio（MinIO）/ fastdfs（FastDFS）
  local:
    base-path: ./uploads     # 本地文件存储根目录
    access-path: /images     # 本地文件访问路径前缀
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY:}
    access-key-secret: ${OSS_SECRET:}
    bucket-name: ${OSS_BUCKET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET:}
    bucket-name: ${MINIO_BUCKET:ai-images}
  fastdfs:
    tracker-servers: ${FASTDFS_TRACKER:}
    web-server-url: ${FASTDFS_WEB_URL:}
