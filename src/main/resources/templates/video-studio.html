<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 短视频工作室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 24px 32px; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 24px; font-weight: 600; color: #fff; }
        .header p { font-size: 14px; color: #888; margin-top: 4px; }
        .container { max-width: 1280px; margin: 0 auto; padding: 32px; }

        /* ===== 脚本管理栏 ===== */
        .script-bar { display: flex; gap: 12px; align-items: center; background: #1a1a2e; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; border: 1px solid #2a2a3e; flex-wrap: wrap; }
        .script-bar select { background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; border-radius: 8px; padding: 8px 12px; font-size: 14px; max-width: 320px; }
        .script-bar select:focus { outline: none; border-color: #4a6cf7; }
        .script-bar .divider { width: 1px; height: 24px; background: #2a2a3e; }
        .script-bar .bar-label { font-size: 13px; color: #888; }

        /* ===== 创意输入 ===== */
        .input-section { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #2a2a3e; }
        .input-section label { display: block; font-size: 14px; font-weight: 500; color: #aaa; margin-bottom: 8px; }
        .input-row { display: flex; gap: 12px; }
        .input-row textarea { flex: 1; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 15px; resize: vertical; min-height: 60px; font-family: inherit; }
        .input-row textarea:focus { outline: none; border-color: #4a6cf7; }
        .input-row textarea::placeholder { color: #555; }

        /* ===== 按钮 ===== */
        .btn { background: #4a6cf7; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
        .btn:hover { background: #3a5ce7; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-sm { padding: 6px 14px; font-size: 13px; }
        .btn-green { background: #2ecc71; } .btn-green:hover { background: #27ae60; } .btn-green:disabled { background: #333; color: #666; }
        .btn-orange { background: #e67e22; } .btn-orange:hover { background: #d35400; }
        .btn-red { background: #c0392b; } .btn-red:hover { background: #a93226; }
        .btn-ghost { background: transparent; border: 1px solid #444; color: #aaa; }
        .btn-ghost:hover { border-color: #4a6cf7; color: #fff; background: transparent; }

        /* ===== 进度条（真实百分比） ===== */
        .progress-bar { background: #1a1a2e; border-radius: 8px; padding: 16px 24px; margin-bottom: 24px; border: 1px solid #2a2a3e; display: none; }
        .progress-bar.visible { display: block; }
        .progress-bar .label { font-size: 14px; color: #aaa; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .progress-bar .label .pct { color: #4a6cf7; font-weight: 600; }
        .progress-bar .bar { height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-bar .bar-fill { height: 100%; background: #4a6cf7; border-radius: 3px; transition: width 0.3s; width: 0%; }
        .progress-bar .bar-fill.indeterminate { width: 30%; animation: indeterminate 1.5s infinite ease-in-out; }
        @keyframes indeterminate { 0%{margin-left:0} 50%{margin-left:70%} 100%{margin-left:0} }

        /* ===== 脚本详情 ===== */
        .storyboard-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
        .storyboard-header h2 { font-size: 22px; color: #fff; }
        .storyboard-header .meta { font-size: 13px; color: #888; margin-top: 6px; }
        .storyboard-header .head-actions { display: flex; gap: 8px; }
        .action-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; background: #14142250; padding: 14px; border-radius: 10px; border: 1px dashed #2a2a3e; }
        .action-bar .info { font-size: 13px; color: #888; margin-left: auto; }
        .action-bar select { background: #0f0f1a; border: 1px solid #333; color: #e0e0e0; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
        .action-bar .bar-label { font-size: 13px; color: #888; }
        .action-bar .divider { width: 1px; height: 24px; background: #2a2a3e; }
        .action-bar label.subtitle-toggle { font-size: 13px; color: #ccc; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
        .action-bar label.subtitle-toggle input { accent-color: #4a6cf7; }
        .status { text-align: center; padding: 40px; color: #888; font-size: 15px; }
        .status.loading { color: #4a6cf7; } .status.error { color: #f74a4a; }

        /* ===== 状态徽章 ===== */
        .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
        .badge-DRAFT { background: #3a3a4e; color: #aaa; }
        .badge-PENDING { background: #4a3a1e; color: #f5b041; }
        .badge-GENERATING { background: #1e2a4a; color: #4a9cf7; }
        .badge-READY { background: #1a3a2a; color: #2ecc71; }
        .badge-FAILED { background: #3a1a1a; color: #f74a4a; }
        .badge-EXPORTED { background: #2a1a3a; color: #a569f7; }

        /* ===== 镜头卡片 ===== */
        .shots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .shot-card { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a3e; overflow: hidden; transition: border-color 0.2s, opacity 0.2s; cursor: grab; }
        .shot-card:hover { border-color: #4a6cf7; }
        .shot-card.has-image { border-color: #2a3e2a; }
        .shot-card.has-image:hover { border-color: #2ecc71; }
        .shot-card.drag-over { border-color: #e67e22; opacity: 0.6; }
        .shot-card.dragging { opacity: 0.4; }
        .shot-card .drag-hint { font-size: 11px; color: #555; text-align: right; padding: 6px 12px 0; }
        .shot-image { width: 100%; aspect-ratio: 16/9; background: #111; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .shot-image img { width: 100%; height: 100%; object-fit: cover; }
        .shot-image .placeholder { color: #444; font-size: 14px; }
        .shot-image .loading-spinner { color: #4a6cf7; font-size: 14px; }
        .shot-body { padding: 16px; }
        .shot-number { display: inline-block; background: #4a6cf7; color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
        .shot-duration { display: inline-block; background: #2a2a3e; color: #aaa; font-size: 12px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
        .shot-scene { font-size: 14px; color: #ccc; margin: 10px 0 8px; line-height: 1.5; }
        .shot-narration { font-size: 13px; color: #888; font-style: italic; margin-bottom: 8px; padding: 8px; background: #0f0f1a; border-radius: 6px; }
        .shot-camera { font-size: 12px; color: #666; margin-bottom: 10px; }
        .shot-prompt { font-size: 12px; color: #555; word-break: break-all; padding: 8px; background: #0a0a15; border-radius: 4px; margin-bottom: 12px; max-height: 100px; overflow-y: auto; }
        .shot-prompt strong { color: #777; }
        .shot-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

        /* ===== 镜头编辑表单 ===== */
        .edit-form { padding: 4px 0; }
        .edit-form label { display: block; font-size: 12px; color: #888; margin: 10px 0 4px; }
        .edit-form textarea { width: 100%; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 13px; font-family: inherit; resize: vertical; min-height: 54px; }
        .edit-form input { width: 100%; background: #0f0f1a; border: 1px solid #333; border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 13px; }
        .edit-form textarea:focus, .edit-form input:focus { outline: none; border-color: #4a6cf7; }
        .edit-form .form-actions { display: flex; gap: 8px; margin-top: 12px; }

        /* ===== 视频结果 ===== */
        .video-result { background: #1a1a2e; border-radius: 12px; border: 1px solid #2a2a3e; padding: 24px; margin-top: 24px; text-align: center; }
        .video-result h3 { color: #fff; margin-bottom: 16px; font-size: 18px; }
        .video-result video { max-width: 100%; border-radius: 8px; background: #000; }
        .video-result .download-link { display: inline-block; margin-top: 12px; color: #4a6cf7; font-size: 14px; text-decoration: underline; }
        .video-result .meta-tags { margin-top: 10px; font-size: 13px; color: #888; }
        .video-result .meta-tags .badge { margin: 0 3px; }

        /* ===== 导出历史 ===== */
        .export-history { background: #14141f; border: 1px solid #2a2a3e; border-radius: 10px; padding: 16px 20px; margin-top: 16px; }
        .export-history h3 { font-size: 15px; color: #aaa; margin-bottom: 10px; }
        .export-item { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: #888; padding: 8px 0; border-bottom: 1px solid #22222e; }
        .export-item:last-child { border-bottom: none; }
        .export-item a { color: #4a6cf7; text-decoration: none; font-size: 13px; }
        .export-item a:hover { text-decoration: underline; }
        .export-item.failed .failed-text { color: #f74a4a; }

        /* ===== Toast 提示 ===== */
        .toast { position: fixed; top: 20px; right: 20px; max-width: 420px; background: #1a1a2e; border: 1px solid #4a6cf7; border-radius: 10px; padding: 14px 20px; font-size: 14px; color: #e0e0e0; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 999; display: none; }
        .toast.visible { display: block; }
        .toast.error { border-color: #f74a4a; }
        .toast.success { border-color: #2ecc71; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI 短视频工作室</h1>
        <p>创意想法 → 分镜脚本 → 提示词优化 → 批量生成画面（SSE 实时进度） → 快速预览 / BGM 配乐 / 多比例高清导出</p>
    </div>
    <div class="container">
        <!-- 脚本管理栏 -->
        <div class="script-bar">
            <span class="bar-label">我的脚本</span>
            <select id="scriptSelect" onchange="onScriptSelectChange()">
                <option value="">— 选择脚本 —</option>
            </select>
            <button class="btn btn-sm btn-ghost" onclick="loadScriptList()">刷新列表</button>
            <button class="btn btn-sm" onclick="newScriptMode()">+ 新建脚本</button>
            <div class="divider"></div>
            <span class="bar-label">视觉风格</span>
            <select id="styleSelect"></select>
            <div class="divider"></div>
            <span class="bar-label">图像生成器</span>
            <select id="generatorSelect" onchange="switchGenerator()"></select>
        </div>

        <!-- 创意输入区（新建模式显示） -->
        <div class="input-section" id="ideaSection" style="display:none;">
            <label>创意想法</label>
            <div class="input-row">
                <textarea id="ideaInput" placeholder="描述你的短视频创意，例如：一个关于猫咪日常生活的温馨短片..." rows="2"></textarea>
                <button class="btn" id="generateBtn" onclick="generateScript()">生成分镜脚本</button>
            </div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar">
            <div class="label"><span id="progressLabel">处理中...</span><span class="pct" id="progressPct"></span></div>
            <div class="bar"><div class="bar-fill" id="progressFill"></div></div>
        </div>

        <!-- 脚本详情区 -->
        <div id="scriptArea"></div>
        <!-- 空状态 -->
        <div id="emptyArea"><div class="status">选择已有脚本，或点击「+ 新建脚本」输入创意开始</div></div>
    </div>
    <div class="toast" id="toast"></div>
<script>
// ==================== 全局状态 ====================
let currentScript = null;   // 当前加载的脚本（含 shots）
let styles = [];           // 视觉风格预设
let generators = [];        // 图像生成器列表
let editingShotId = null;   // 正在编辑的镜头ID
let draggedShotId = null;   // 拖拽中的镜头ID
let eventSource = null;     // SSE 连接
let batchGenerating = false;// 是否正在批量生成图片
let exporting = false;      // 是否正在导出视频
let bgmList = [];           // BGM 列表（内置 + 用户上传）
let currentBgmId = '';      // 当前选中的 BGM
let currentAspect = '16:9'; // 导出画面比例
let currentResolution = '720p'; // 高清导出分辨率
let currentSubtitle = true; // 导出时是否烧录字幕（模块 F）

// ==================== 基础工具 ====================
function esc(t) { if (!t) return ''; var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

async function api(url, options) {
    try {
        const resp = await fetch(url, options);
        const data = await resp.json().catch(() => ({ success: false, message: '响应解析失败 (HTTP ' + resp.status + ')' }));
        return data;
    } catch (e) {
        return { success: false, message: '请求失败: ' + e.message };
    }
}

function post(url, body) {
    return api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}
function put(url, body) {
    return api(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
}

let toastTimer = null;
function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast visible ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 4000);
}

function showProgress(label, indeterminate) {
    document.getElementById('progressBar').classList.add('visible');
    document.getElementById('progressLabel').textContent = label;
    const fill = document.getElementById('progressFill');
    fill.className = 'bar-fill' + (indeterminate ? ' indeterminate' : '');
    if (indeterminate) { fill.style.width = ''; document.getElementById('progressPct').textContent = ''; }
}
function setProgress(percent) {
    document.getElementById('progressFill').className = 'bar-fill';
    document.getElementById('progressFill').style.width = Math.min(100, Math.max(0, percent)) + '%';
    document.getElementById('progressPct').textContent = Math.round(percent) + '%';
}
function hideProgress() { document.getElementById('progressBar').classList.remove('visible'); }

// ==================== 页面初始化 ====================
async function init() {
    // 登录检测：页面与 /api/video/** 均为 permitAll，但业务接口依赖登录用户
    const auth = await api('/api/auth/user');
    if (!auth.success) {
        document.getElementById('emptyArea').innerHTML =
            '<div class="status error">请先 <a href="/login" style="color:#4a6cf7;">登录</a> 后使用短视频工作室</div>';
        return;
    }
    await Promise.all([loadStyles(), loadGenerators(), loadBgmList()]);
    await loadScriptList();
}
window.addEventListener('DOMContentLoaded', init);

// ==================== 风格与生成器 ====================
async function loadStyles() {
    const data = await api('/api/video/enhance-prompt/styles');
    if (!data.success) return;
    styles = data.data || [];
    const sel = document.getElementById('styleSelect');
    sel.innerHTML = '<option value="">默认（电影写实）</option>' +
        styles.map(s => '<option value="' + esc(s.name) + '">' + esc(s.displayName) + '</option>').join('');
}

async function loadGenerators() {
    const data = await api('/api/video/images/generators');
    if (!data.success) return;
    generators = data.data || [];
    const sel = document.getElementById('generatorSelect');
    sel.innerHTML = generators.map(g =>
        '<option value="' + esc(g.type) + '"' + (g.active ? ' selected' : '') + '>' +
        esc(g.name) + (g.available ? '' : '（不可用）') + '</option>').join('');
}

async function switchGenerator() {
    const type = document.getElementById('generatorSelect').value;
    const data = await put('/api/video/images/generator?type=' + encodeURIComponent(type));
    if (data.success) toast('图像生成器已切换为: ' + type, 'success');
    else { toast(data.message || '切换失败', 'error'); loadGenerators(); }
}

function currentStyle() { return document.getElementById('styleSelect').value; }

// ==================== 脚本列表与加载 ====================
async function loadScriptList(keepSelection) {
    const data = await api('/api/video/scripts');
    if (!data.success) { toast(data.message || '获取脚本列表失败（请先登录）', 'error'); return; }
    const sel = document.getElementById('scriptSelect');
    const prev = keepSelection ? sel.value : (currentScript ? currentScript.id : '');
    sel.innerHTML = '<option value="">— 选择脚本 —</option>' +
        (data.data || []).map(s =>
            '<option value="' + s.id + '">' + esc(s.title || ('脚本 #' + s.id)) + ' (' + s.shotCount + '镜头 · ' + esc(s.status) + ')</option>').join('');
    if (prev) sel.value = prev;
}

function newScriptMode() {
    currentScript = null;
    document.getElementById('scriptSelect').value = '';
    document.getElementById('ideaSection').style.display = '';
    document.getElementById('scriptArea').innerHTML = '';
    document.getElementById('emptyArea').style.display = 'none';
    document.getElementById('ideaInput').focus();
}

async function onScriptSelectChange() {
    const id = document.getElementById('scriptSelect').value;
    if (!id) { currentScript = null; document.getElementById('scriptArea').innerHTML = ''; document.getElementById('emptyArea').style.display = ''; return; }
    await loadScriptDetail(id);
}

async function loadScriptDetail(id) {
    const data = await api('/api/video/scripts/' + id);
    if (!data.success) { toast(data.message || '加载脚本失败', 'error'); return; }
    currentScript = data.data;
    editingShotId = null;
    document.getElementById('ideaSection').style.display = 'none';
    document.getElementById('emptyArea').style.display = 'none';
    renderScript();
    loadExportHistory();
}

// ==================== 脚本生成（模块 A） ====================
async function generateScript() {
    const idea = document.getElementById('ideaInput').value.trim();
    if (!idea) { toast('请输入创意想法', 'error'); return; }
    const btn = document.getElementById('generateBtn');
    btn.disabled = true; btn.textContent = '生成中...';
    showProgress('正在生成分镜脚本，请稍候（约 15-30 秒）...', true);
    const data = await post('/api/video/scripts/generate', { idea });
    btn.disabled = false; btn.textContent = '生成分镜脚本';
    hideProgress();
    if (!data.success) { toast(data.message || '生成失败', 'error'); return; }
    toast('分镜脚本生成成功', 'success');
    await loadScriptList(true);
    document.getElementById('scriptSelect').value = data.data.id;
    currentScript = data.data;
    document.getElementById('ideaSection').style.display = 'none';
    document.getElementById('emptyArea').style.display = 'none';
    renderScript();
}

// ==================== 脚本信息管理 ====================
async function renameScript() {
    if (!currentScript) return;
    const title = prompt('新的脚本标题:', currentScript.title || '');
    if (!title || title.trim() === '') return;
    const data = await put('/api/video/scripts/' + currentScript.id, { title: title.trim() });
    if (data.success) { toast('标题已更新', 'success'); await loadScriptList(true); currentScript.title = title.trim(); renderScript(); }
    else toast(data.message || '更新失败', 'error');
}

async function deleteScript() {
    if (!currentScript) return;
    if (!confirm('确定删除脚本「' + (currentScript.title || currentScript.id) + '」？此操作不可恢复。')) return;
    const data = await api('/api/video/scripts/' + currentScript.id, { method: 'DELETE' });
    if (!data.success) { toast(data.message || '删除失败', 'error'); return; }
    toast('脚本已删除', 'success');
    currentScript = null;
    document.getElementById('scriptArea').innerHTML = '';
    document.getElementById('emptyArea').style.display = '';
    await loadScriptList();
}

// ==================== 渲染 ====================
function renderScript() {
    if (!currentScript) return;
    const sc = currentScript;
    const total = sc.shots ? sc.shots.length : 0;
    const readyCount = sc.shots ? sc.shots.filter(s => s.imageStatus === 'READY').length : 0;
    const totalDuration = sc.shots ? sc.shots.reduce((sum, s) => sum + (s.durationSeconds || 0), 0) : (sc.totalDuration || 0);
    const allReady = total > 0 && readyCount === total;

    let h = '<div class="storyboard-header">';
    h += '<div><h2>' + esc(sc.title) + '<span class="badge badge-' + esc(sc.status) + '">' + esc(sc.status) + '</span></h2>';
    h += '<div class="meta">' + esc(sc.theme || '') + ' | ' + total + ' 个镜头 | 总时长 ' + totalDuration + 's</div></div>';
    h += '<div class="head-actions"><button class="btn btn-sm btn-ghost" onclick="renameScript()">重命名</button>';
    h += '<button class="btn btn-sm btn-red" onclick="deleteScript()">删除脚本</button></div>';
    h += '</div>';

    h += '<div class="action-bar">';
    h += '<button class="btn btn-sm btn-orange" id="enhanceAllBtn" onclick="enhanceAllPrompts()" ' + (batchGenerating ? 'disabled' : '') + '>批量优化提示词</button>';
    h += '<button class="btn btn-sm btn-green" id="genAllBtn" onclick="generateAllImages()" ' + (batchGenerating || allReady ? 'disabled' : '') + '>一键生成所有图片</button>';
    h += '<button class="btn btn-sm" id="addShotBtn" onclick="addShot()" ' + (batchGenerating ? 'disabled' : '') + '>+ 添加镜头</button>';
    // 导出工具组（模块 C：预览/多比例高清导出；模块 D：BGM）
    h += '<span class="divider"></span>';
    h += '<span class="bar-label">BGM</span>';
    h += '<select id="bgmSelect" onchange="onBgmSelectChange()" title="背景音乐，导出时自动降低音量并淡入淡出">' + bgmOptionsHtml() + '</select>';
    h += '<button class="btn btn-sm btn-ghost" onclick="recommendBgm()" title="AI 根据脚本主题推荐配乐">AI推荐</button>';
    h += '<button class="btn btn-sm btn-ghost" onclick="document.getElementById(\'bgmFileInput\').click()" title="上传自定义 BGM（mp3/wav/ogg/m4a/flac）">上传</button>';
    h += '<input type="file" id="bgmFileInput" accept=".mp3,.wav,.ogg,.m4a,.flac" style="display:none" onchange="uploadBgmFile(this)">';
    h += '<label class="subtitle-toggle"><input type="checkbox" id="subtitleToggle"' + (currentSubtitle ? ' checked' : '') + ' onchange="currentSubtitle=this.checked" title="将旁白烧录进视频画面（社媒静音观看友好，无旁白时自动忽略）"> 烧录字幕</label>';
    h += '<span class="divider"></span>';
    h += '<span class="bar-label">比例</span>';
    h += '<select id="aspectSelect" onchange="currentAspect=this.value">';
    h += '<option value="16:9"' + (currentAspect === '16:9' ? ' selected' : '') + '>16:9 横屏(B站)</option>';
    h += '<option value="9:16"' + (currentAspect === '9:16' ? ' selected' : '') + '>9:16 竖屏(抖音)</option>';
    h += '<option value="1:1"' + (currentAspect === '1:1' ? ' selected' : '') + '>1:1 方形(小红书)</option>';
    h += '</select>';
    h += '<select id="resolutionSelect" onchange="currentResolution=this.value" title="高清导出分辨率（预览固定 480p）">';
    h += '<option value="720p"' + (currentResolution === '720p' ? ' selected' : '') + '>720p</option>';
    h += '<option value="1080p"' + (currentResolution === '1080p' ? ' selected' : '') + '>1080p</option>';
    h += '</select>';
    h += '<button class="btn btn-sm btn-green" id="previewBtn" onclick="exportVideo(true)" ' + (!allReady || exporting ? 'disabled' : '') + '>快速预览(480p)</button>';
    h += '<button class="btn btn-sm" id="exportBtn" onclick="exportVideo(false)" ' + (!allReady || exporting ? 'disabled' : '') + '>高清导出</button>';
    h += '<button class="btn btn-sm btn-ghost" id="srtBtn" onclick="exportSrt()" ' + (batchGenerating ? 'disabled' : '') + ' title="单独导出 SRT 字幕文件（社媒平台上传用，不烧录画面）">导出SRT</button>';
    h += '<button class="btn btn-sm btn-ghost" id="subtitlePreviewBtn" onclick="previewSubtitle()" ' + (batchGenerating ? 'disabled' : '') + ' title="按当前比例生成一帧字幕效果预览图（需首镜头已生成图片）">字幕预览</button>';
    h += '<span class="info" id="imageCountInfo">已生成: ' + readyCount + '/' + total + ' 张图片 · 镜头卡片可拖拽排序</span>';
    h += '</div>';

    h += '<div class="shots-grid">';
    (sc.shots || []).forEach(shot => { h += shotCardHtml(shot); });
    h += '</div><div id="videoResultArea"></div><div id="exportHistoryArea"></div>';

    document.getElementById('scriptArea').innerHTML = h;
}

function shotCardHtml(shot) {
    const hasImg = shot.imageUrl && shot.imageStatus === 'READY';
    let imgH = '<span class="placeholder">' + (shot.imageStatus === 'FAILED' ? '<span style="color:#f74a4a">生成失败</span>' : (shot.imageStatus === 'GENERATING' ? '<span class="loading-spinner">生成中...</span>' : '未生成图片')) + '</span>';
    if (hasImg) imgH = '<img src="' + esc(shot.imageUrl) + '" alt="Shot ' + shot.shotOrder + '">';

    let h = '<div class="shot-card ' + (hasImg ? 'has-image' : '') + '" id="shot-' + shot.id + '" draggable="true" ondragstart="dragStart(event, ' + shot.id + ')" ondragend="dragEnd(event)" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event, ' + shot.id + ')">';
    h += '<div class="drag-hint">⋮⋮ 拖拽排序</div>';
    h += '<div class="shot-image" id="shot-image-' + shot.id + '">' + imgH + '</div>';
    h += '<div class="shot-body">';
    h += '<span class="shot-number">镜头 ' + shot.shotOrder + '</span><span class="shot-duration">' + shot.durationSeconds + 's</span><span class="badge badge-' + esc(shot.imageStatus) + '">' + esc(shot.imageStatus) + '</span>';

    if (editingShotId === shot.id) {
        h += '<div class="edit-form">';
        h += '<label>画面描述</label><textarea id="edit-scene-' + shot.id + '">' + esc(shot.sceneDescription) + '</textarea>';
        h += '<label>旁白</label><textarea id="edit-narr-' + shot.id + '">' + esc(shot.narration) + '</textarea>';
        h += '<label>图像提示词（英文）</label><textarea id="edit-prompt-' + shot.id + '" style="min-height:70px">' + esc(shot.imagePrompt) + '</textarea>';
        h += '<label>镜头运动</label><input id="edit-camera-' + shot.id + '" value="' + esc(shot.cameraMovement) + '">';
        h += '<label>时长（秒）</label><input type="number" min="1" max="30" id="edit-dur-' + shot.id + '" value="' + (shot.durationSeconds || 5) + '">';
        h += '<div class="form-actions"><button class="btn btn-sm" onclick="saveShotEdit(' + shot.id + ')">保存</button><button class="btn btn-sm btn-ghost" onclick="toggleShotEdit(null)">取消</button></div>';
        h += '</div>';
    } else {
        h += '<div class="shot-scene">' + esc(shot.sceneDescription) + '</div>';
        h += '<div class="shot-narration">' + esc(shot.narration) + '</div>';
        h += '<div class="shot-camera">镜头运动: ' + esc(shot.cameraMovement || '固定') + '</div>';
        h += '<div class="shot-prompt"><strong>Image Prompt: </strong>' + esc(shot.imagePrompt) + '</div>';
        h += '<div class="shot-actions">';
        h += '<button class="btn btn-sm btn-ghost" onclick="toggleShotEdit(' + shot.id + ')">编辑</button>';
        h += '<button class="btn btn-sm btn-orange" onclick="enhanceShotPrompt(' + shot.id + ')" ' + (batchGenerating ? 'disabled' : '') + '>优化提示词</button>';
        h += '<button class="btn btn-sm" onclick="generateShotImage(' + shot.id + ')" ' + (batchGenerating ? 'disabled' : '') + '>' + (hasImg ? '重新生成' : '生成图片') + '</button>';
        h += '<button class="btn btn-sm btn-red" onclick="deleteShot(' + shot.id + ')">删除</button>';
        h += '</div>';
    }
    h += '</div></div>';
    return h;
}

// ==================== 镜头编辑（模块 A） ====================
function toggleShotEdit(shotId) {
    editingShotId = shotId;
    renderScript();
}

async function saveShotEdit(shotId) {
    const promptChanged = document.getElementById('edit-prompt-' + shotId).value !== (findShot(shotId).imagePrompt || '');
    const body = {
        sceneDescription: document.getElementById('edit-scene-' + shotId).value,
        narration: document.getElementById('edit-narr-' + shotId).value,
        imagePrompt: document.getElementById('edit-prompt-' + shotId).value,
        cameraMovement: document.getElementById('edit-camera-' + shotId).value,
        durationSeconds: parseInt(document.getElementById('edit-dur-' + shotId).value) || 5
    };
    const data = await put('/api/video/scripts/' + currentScript.id + '/shots/' + shotId, body);
    if (!data.success) { toast(data.message || '保存失败', 'error'); return; }
    toast('镜头已更新' + (promptChanged ? '，提示词已变化，需重新生成图片' : ''), 'success');
    await loadScriptDetail(currentScript.id);
    document.getElementById('scriptSelect').value = currentScript.id;
}

function findShot(shotId) { return (currentScript.shots || []).find(s => s.id === shotId); }

async function deleteShot(shotId) {
    if (!confirm('确定删除该镜头？')) return;
    const data = await api('/api/video/scripts/' + currentScript.id + '/shots/' + shotId, { method: 'DELETE' });
    if (!data.success) { toast(data.message || '删除失败', 'error'); return; }
    toast('镜头已删除', 'success');
    await loadScriptDetail(currentScript.id);
}

async function addShot() {
    const data = await post('/api/video/scripts/' + currentScript.id + '/shots', {
        sceneDescription: '新的镜头（请编辑画面描述）',
        narration: '', imagePrompt: '', cameraMovement: '固定', durationSeconds: 5, imageStatus: 'PENDING'
    });
    if (!data.success) { toast(data.message || '添加失败', 'error'); return; }
    toast('镜头已添加', 'success');
    await loadScriptDetail(currentScript.id);
}

// ==================== 拖拽排序（模块 A） ====================
function dragStart(e, shotId) {
    draggedShotId = shotId;
    e.dataTransfer.effectAllowed = 'move';
    e.currentTarget.classList.add('dragging');
}
function dragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

async function drop(e, targetShotId) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!draggedShotId || draggedShotId === targetShotId) return;
    const shots = currentScript.shots;
    const from = shots.findIndex(s => s.id === draggedShotId);
    const to = shots.findIndex(s => s.id === targetShotId);
    if (from < 0 || to < 0) return;
    const moved = shots.splice(from, 1)[0];
    shots.splice(to, 0, moved);
    shots.forEach((s, i) => { s.shotOrder = i + 1; });
    draggedShotId = null;
    renderScript();
    const data = await put('/api/video/scripts/' + currentScript.id + '/shots/reorder', { shotIds: shots.map(s => s.id) });
    if (data.success) toast('镜头顺序已更新', 'success');
    else { toast(data.message || '排序保存失败', 'error'); await loadScriptDetail(currentScript.id); }
}

// ==================== 提示词优化（模块 B） ====================
async function enhanceShotPrompt(shotId) {
    const shot = findShot(shotId);
    if (!shot) return;
    const source = shot.imagePrompt && shot.imagePrompt.trim() ? shot.imagePrompt : shot.sceneDescription;
    if (!source || !source.trim()) { toast('该镜头没有可优化的提示词或画面描述', 'error'); return; }
    toast('正在优化镜头 ' + shot.shotOrder + ' 的提示词...', '');
    const data = await post('/api/video/enhance-prompt', { sceneDescription: source, style: currentStyle() });
    if (!data.success) { toast(data.message || '优化失败', 'error'); return; }
    // 将优化结果写回镜头
    const update = await put('/api/video/scripts/' + currentScript.id + '/shots/' + shotId, { imagePrompt: data.data.enhancedPrompt });
    if (!update.success) { toast(update.message || '提示词保存失败', 'error'); return; }
    toast('镜头 ' + shot.shotOrder + ' 提示词已优化（图片需重新生成）', 'success');
    await loadScriptDetail(currentScript.id);
}

async function enhanceAllPrompts() {
    if (!currentScript) return;
    if (!confirm('将使用 LLM 逐个优化所有镜头的提示词（可能需要 1-2 分钟），继续？')) return;
    const btn = document.getElementById('enhanceAllBtn');
    btn.disabled = true; btn.textContent = '优化中...';
    showProgress('正在批量优化提示词（逐镜头调用 LLM，请勿关闭页面）...', true);
    const data = await post('/api/video/enhance-prompt/script/' + currentScript.id, { style: currentStyle() });
    btn.disabled = false; btn.textContent = '批量优化提示词';
    hideProgress();
    if (!data.success) { toast(data.message || '批量优化失败', 'error'); return; }
    toast(data.message || '批量优化完成', data.failed > 0 ? '' : 'success');
    await loadScriptDetail(currentScript.id);
}

// ==================== 单镜头图片生成（模块 C） ====================
async function generateShotImage(shotId) {
    const shot = findShot(shotId);
    if (!shot) return;
    const imgBox = document.getElementById('shot-image-' + shotId);
    const actions = document.querySelector('#shot-' + shotId + ' .shot-actions');
    if (imgBox) imgBox.innerHTML = '<span class="loading-spinner">生成中...</span>';
    if (actions) actions.style.opacity = '0.5';
    const data = await post('/api/video/images/shot/' + currentScript.id + '/' + shotId, { style: currentStyle() });
    if (actions) actions.style.opacity = '';
    if (!data.success) {
        if (imgBox) imgBox.innerHTML = '<span class="placeholder" style="color:#f74a4a">' + esc(data.message || '生成失败') + '</span>';
        toast(data.message || '图片生成失败', 'error');
        return;
    }
    // 更新本地状态并重渲染
    const updated = data.data;
    shot.imageUrl = updated.imageUrl;
    shot.imageFileId = updated.imageFileId;
    shot.imageStatus = updated.imageStatus;
    toast('镜头 ' + shot.shotOrder + ' 图片生成成功', 'success');
    renderScript();
}

// ==================== SSE 批量生成（模块 E：并行生成 + 实时进度） ====================
function generateAllImages() {
    if (!currentScript || batchGenerating) return;
    const pending = (currentScript.shots || []).filter(s => s.imageStatus !== 'READY');
    if (pending.length === 0) { toast('所有镜头图片均已生成', ''); return; }
    batchGenerating = true;
    setBatchButtons(true);
    showProgress('正在连接生成服务...', true);

    const url = '/api/video/images/script/' + currentScript.id + '/stream?style=' + encodeURIComponent(currentStyle());
    eventSource = new EventSource(url);

    const types = ['START', 'SHOT_START', 'SHOT_COMPLETE', 'SHOT_FAILED', 'COMPLETE', 'ERROR'];
    types.forEach(t => eventSource.addEventListener(t, e => handleSseEvent(t, JSON.parse(e.data))));
    eventSource.onerror = () => {
        // COMPLETE 后浏览器关闭连接也会触发 onerror，仅在非完成态时提示
        if (batchGenerating) {
            batchGenerating = false;
            setBatchButtons(false);
            closeSse();
            hideProgress();
            toast('生成连接中断，请重试', 'error');
        }
    };
}

function closeSse() {
    if (eventSource) { eventSource.close(); eventSource = null; }
}

function setBatchButtons(generating) {
    const g = document.getElementById('genAllBtn'); if (g) { g.disabled = generating; g.textContent = generating ? '生成中...' : '一键生成所有图片'; }
    const e = document.getElementById('enhanceAllBtn'); if (e) e.disabled = generating;
    const a = document.getElementById('addShotBtn'); if (a) a.disabled = generating;
    const pv = document.getElementById('previewBtn'); if (pv) pv.disabled = generating || !allShotsReady();
    const ex = document.getElementById('exportBtn'); if (ex) ex.disabled = generating || !allShotsReady();
}

function allShotsReady() {
    const shots = (currentScript && currentScript.shots) || [];
    return shots.length > 0 && shots.every(s => s.imageStatus === 'READY');
}

function handleSseEvent(type, p) {
    if (type === 'START') {
        showProgress('开始批量生成：共 ' + p.totalShots + ' 个镜头...', false);
        setProgress(0);
        (currentScript.shots || []).forEach(s => { s.imageStatus = 'GENERATING'; });
        renderScript();
        setBatchButtons(true);
        return;
    }
    if (type === 'SHOT_START') {
        const imgBox = document.getElementById('shot-image-' + p.shotId);
        if (imgBox) imgBox.innerHTML = '<span class="loading-spinner">生成中...</span>';
        document.getElementById('progressLabel').textContent = p.message || ('正在生成第 ' + p.currentShotIndex + ' 张...');
        return;
    }
    if (type === 'SHOT_COMPLETE') {
        const shot = findShot(p.shotId);
        if (shot) { shot.imageUrl = p.imageUrl; shot.imageStatus = 'READY'; }
        const imgBox = document.getElementById('shot-image-' + p.shotId);
        if (imgBox && p.imageUrl) imgBox.innerHTML = '<img src="' + esc(p.imageUrl) + '">';
        const card = document.getElementById('shot-' + p.shotId);
        if (card) {
            card.classList.add('has-image');
            // 同步更新卡片状态徽章，避免等待全量重渲染
            const badge = card.querySelector('.badge');
            if (badge) { badge.className = 'badge badge-READY'; badge.textContent = 'READY'; }
        }
        updateProgressAndCount(p);
        return;
    }
    if (type === 'SHOT_FAILED') {
        const shot = findShot(p.shotId);
        if (shot) shot.imageStatus = 'FAILED';
        const imgBox = document.getElementById('shot-image-' + p.shotId);
        if (imgBox) imgBox.innerHTML = '<span class="placeholder" style="color:#f74a4a">生成失败</span>';
        updateProgressAndCount(p);
        toast(p.message || '有镜头生成失败', 'error');
        return;
    }
    if (type === 'COMPLETE') {
        batchGenerating = false;
        closeSse();
        setProgress(100);
        setTimeout(hideProgress, 800);
        setBatchButtons(false);
        renderScript(); // 重渲染徽章/按钮状态
        toast(p.message || '批量生成完成', (p.failedShots || 0) > 0 ? '' : 'success');
        loadScriptList(true);
        return;
    }
    if (type === 'ERROR') {
        batchGenerating = false;
        closeSse();
        hideProgress();
        setBatchButtons(false);
        toast(p.message || '生成服务异常', 'error');
    }
}

function updateProgressAndCount(p) {
    const total = p.totalShots || 1;
    const done = (p.completedShots || 0) + (p.failedShots || 0);
    setProgress(done / total * 100);
    const info = document.getElementById('imageCountInfo');
    if (info) info.textContent = '已生成: ' + (p.completedShots || 0) + '/' + total + ' 张图片 · 失败 ' + (p.failedShots || 0);
    const pv = document.getElementById('previewBtn'); if (pv) pv.disabled = !allShotsReady();
    const ex = document.getElementById('exportBtn'); if (ex) ex.disabled = !allShotsReady();
}

// ==================== BGM 管理（模块 D） ====================
async function loadBgmList() {
    const data = await api('/api/video/bgm');
    if (!data.success) return;
    bgmList = data.data || [];
    const sel = document.getElementById('bgmSelect');
    if (sel) { sel.innerHTML = bgmOptionsHtml(); sel.value = currentBgmId; }
}

function bgmOptionsHtml() {
    let h = '<option value="">无 BGM</option>';
    bgmList.forEach(b => {
        h += '<option value="' + b.id + '"' + (String(b.id) === currentBgmId ? ' selected' : '') + '>'
            + esc(b.name) + (b.isBuiltIn ? '' : ' · 自定义') + ' [' + esc(b.category) + ']'
            + (b.durationSeconds ? ' ' + b.durationSeconds + 's' : '')
            + '</option>';
    });
    return h;
}

function onBgmSelectChange() {
    currentBgmId = document.getElementById('bgmSelect').value;
}

async function recommendBgm() {
    if (!currentScript) return;
    const theme = currentScript.idea || currentScript.theme || currentScript.title || '';
    if (!theme) { toast('当前脚本没有主题信息，无法推荐', 'error'); return; }
    toast('AI 正在根据主题「' + theme + '」分析适合的配乐...');
    const data = await api('/api/video/bgm/recommend?theme=' + encodeURIComponent(theme));
    if (!data.success) { toast(data.message || '推荐失败', 'error'); return; }
    const rec = data.data;
    if (!rec.available || !rec.bgm) {
        toast(rec.message || ('推荐分类「' + rec.category + '」，但音乐库暂无该分类曲目，可上传自定义 BGM'), 'error');
        return;
    }
    currentBgmId = String(rec.bgm.id);
    const sel = document.getElementById('bgmSelect');
    if (sel) sel.value = currentBgmId;
    toast('已推荐「' + rec.bgm.name + '」（' + rec.category + '）：' + esc(rec.reason || ''), 'success');
}

async function uploadBgmFile(input) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    fd.append('name', file.name.replace(/\.[^.]+$/, ''));
    toast('正在上传 BGM...');
    const resp = await fetch('/api/video/bgm/upload', { method: 'POST', body: fd });
    const data = await resp.json().catch(() => ({ success: false, message: '响应解析失败' }));
    if (!data.success) { toast(data.message || '上传失败', 'error'); return; }
    toast('BGM 上传成功：' + data.data.name, 'success');
    currentBgmId = String(data.data.id);
    await loadBgmList();
    const sel = document.getElementById('bgmSelect');
    if (sel) sel.value = currentBgmId;
}

// ==================== 视频预览与导出（模块 C） ====================
async function exportVideo(preview) {
    if (!currentScript) return;
    if (exporting) { toast('正在导出中，请稍候', 'error'); return; }
    if (!allShotsReady()) { toast('请先生成所有镜头的图片', 'error'); return; }
    const previewBtn = document.getElementById('previewBtn');
    const exportBtn = document.getElementById('exportBtn');
    const bgmId = document.getElementById('bgmSelect') ? document.getElementById('bgmSelect').value : currentBgmId;

    const body = { scriptId: currentScript.id, aspectRatio: currentAspect, bgmId: bgmId || null, subtitle: currentSubtitle };
    if (!preview) body.resolution = currentResolution;

    exporting = true;
    if (previewBtn) { previewBtn.disabled = true; previewBtn.textContent = '生成中...'; }
    if (exportBtn) { exportBtn.disabled = true; exportBtn.textContent = '生成中...'; }
    showProgress(preview
        ? '正在生成 480p 快速预览（低分辨率 + 水印，快速确认效果）...'
        : '正在导出高清视频（' + currentResolution + ' ' + currentAspect + '，可能需要 1-5 分钟）...', true);

    const data = await post(preview ? '/api/video/export/preview' : '/api/video/export/hd', body);

    exporting = false;
    if (previewBtn) { previewBtn.disabled = false; previewBtn.textContent = '快速预览(480p)'; }
    if (exportBtn) { exportBtn.disabled = false; exportBtn.textContent = '高清导出'; }
    hideProgress();

    if (!data.success) {
        toast(data.message || '导出失败', 'error');
        if (currentScript && currentScript.id === body.scriptId) loadExportHistory();
        return;
    }
    // 导出期间用户可能已切换脚本，仅当仍在原脚本页时才展示结果与历史
    if (currentScript && currentScript.id === body.scriptId) {
        renderVideoResult(data.data.video, data.data);
        loadExportHistory();
    }
    loadScriptList(true); // 高清导出后脚本状态变为 EXPORTED，刷新列表徽章
    toast(preview ? '预览生成完成，确认效果后可高清导出' : '高清导出完成', 'success');
}

function renderVideoResult(video, exportInfo) {
    let a = document.getElementById('videoResultArea');
    if (!a) return;
    let tags = [];
    tags.push(video.width + 'x' + video.height);
    tags.push(video.totalDuration + 's');
    if (video.hasNarration) tags.push('含旁白配音');
    if (video.hasBgm && exportInfo) tags.push('BGM: ' + esc(exportInfo.bgmName || ''));
    if (video.hasSubtitle) tags.push('含烧录字幕');
    if (exportInfo && exportInfo.hasWatermark) tags.push('<span class="badge badge-PENDING">预览版·带水印</span>');
    if (video.fileSizeBytes) tags.push((video.fileSizeBytes / 1048576).toFixed(1) + ' MB');
    a.innerHTML = '<div class="video-result"><h3>' + (exportInfo && exportInfo.hasWatermark ? '快速预览完成' : '高清导出完成') + '</h3>' +
        '<video controls autoplay src="' + video.videoUrl + '">您的浏览器不支持视频播放</video><br>' +
        '<a class="download-link" href="' + video.videoUrl + '" download>下载视频</a>' +
        '<div class="meta-tags">' + tags.join(' | ') + '</div></div>';
    a.scrollIntoView({ behavior: 'smooth' });
}

// ==================== 字幕系统（模块 F） ====================
async function exportSrt() {
    if (!currentScript) return;
    const btn = document.getElementById('srtBtn');
    if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
    const data = await post('/api/video/subtitle/generate', { scriptId: currentScript.id });
    if (btn) { btn.disabled = false; btn.textContent = '导出SRT'; }
    if (!data.success) { toast(data.message || '字幕生成失败', 'error'); return; }
    // 生成 Blob 并触发下载（同时后端已存一份到存储服务）
    const blob = new Blob([data.data.srtContent], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (currentScript.title || ('script_' + currentScript.id)) + '.srt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
    toast('字幕已生成并下载（' + data.data.cueCount + ' 条）', 'success');
}

async function previewSubtitle() {
    if (!currentScript) return;
    const btn = document.getElementById('subtitlePreviewBtn');
    if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
    const data = await post('/api/video/subtitle/preview', { scriptId: currentScript.id, aspectRatio: currentAspect });
    if (btn) { btn.disabled = false; btn.textContent = '字幕预览'; }
    if (!data.success) { toast(data.message || '字幕预览失败', 'error'); return; }
    window.open(data.data.previewUrl, '_blank');
    toast('字幕预览图已在新窗口打开（' + currentAspect + '）', 'success');
}

// ==================== 导出历史（模块 C） ====================
async function loadExportHistory() {
    if (!currentScript) return;
    const area = document.getElementById('exportHistoryArea');
    if (!area) return;
    const data = await api('/api/video/exports/' + currentScript.id);
    if (!data.success) { area.innerHTML = ''; return; }
    const list = data.data || [];
    if (!list.length) { area.innerHTML = ''; return; }
    let h = '<div class="export-history"><h3>导出历史</h3>';
    list.forEach(e => {
        h += '<div class="export-item' + (e.status === 'FAILED' ? ' failed' : '') + '">';
        h += '<span>' + esc((e.createdAt || '').replace('T', ' ').substring(0, 19)) + '</span>';
        h += '<span>' + esc(e.resolution) + ' · ' + esc(e.aspectRatio) + (e.width ? '（' + e.width + 'x' + e.height + '）' : '') + '</span>';
        if (e.status === 'FAILED') {
            h += '<span class="failed-text">失败：' + esc(e.errorMessage || '未知原因') + '</span>';
        } else {
            if (e.hasWatermark) h += '<span class="badge badge-PENDING">预览</span>';
            else h += '<span class="badge badge-EXPORTED">正式版</span>';
            if (e.bgmName) h += '<span>BGM: ' + esc(e.bgmName) + '</span>';
            if (e.hasSubtitle) h += '<span>含字幕</span>';
            if (e.fileSizeBytes) h += '<span>' + (e.fileSizeBytes / 1048576).toFixed(1) + ' MB</span>';
            if (e.videoUrl) h += '<a href="' + esc(e.videoUrl) + '" download>下载</a> <a href="' + esc(e.videoUrl) + '" target="_blank">播放</a>';
        }
        h += '</div>';
    });
    h += '</div>';
    area.innerHTML = h;
}

// Ctrl+Enter 快捷生成
document.getElementById('ideaInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateScript();
});
