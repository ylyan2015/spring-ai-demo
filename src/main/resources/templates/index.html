<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Chat</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>新对话</span>
                </button>
            </div>
            
            <div class="conversation-list" id="conversationList">
                <!-- 会话列表将动态加载 -->
            </div>
            
            <div class="datetime-display" id="datetimeDisplay">
                <div class="datetime-time" id="datetimeTime">--:--:--</div>
                <div class="datetime-date" id="datetimeDate">----</div>
                <div class="datetime-weather" id="datetimeWeather"></div>
            </div>
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">
                    <span class="user-name" id="userName"></span>
                    <button class="logout-btn" id="logoutBtn" onclick="doLogout()">退出</button>
                </div>
                <div class="model-selector" style="margin-top:12px">
                    <label for="modelSelect">模型：</label>
                    <select id="modelSelect" class="model-select">
                        <option value="ollama">离线模式</option>
                        <option value="deepseek">DeepSeek V3</option>
                        <option value="openai">OpenAI GPT</option>
                    </select>
                </div>
                <!-- 参数预设面板 -->
                <div class="param-panel" id="paramPanel">
                    <button class="param-toggle-btn" id="paramToggleBtn" onclick="toggleParamPanel()">
                        <span>参数设置</span>
                        <svg id="paramArrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="param-body" id="paramBody" style="display:none;">
                        <div class="param-row">
                            <label>Temperature</label>
                            <div class="param-input-group">
                                <input type="range" id="paramTemperature" min="0" max="2" step="0.1" value="0.7">
                                <span class="param-val" id="valTemperature">0.7</span>
                            </div>
                        </div>
                        <div class="param-row">
                            <label>Max Tokens</label>
                            <div class="param-input-group">
                                <input type="number" id="paramMaxTokens" min="1" max="8192" step="1" value="2048" class="param-number">
                            </div>
                        </div>
                        <div class="param-row">
                            <label>Top P</label>
                            <div class="param-input-group">
                                <input type="range" id="paramTopP" min="0" max="1" step="0.05" value="0.9">
                                <span class="param-val" id="valTopP">0.9</span>
                            </div>
                        </div>
                        <div class="param-row">
                            <label>Top K</label>
                            <div class="param-input-group">
                                <input type="number" id="paramTopK" min="1" max="100" step="1" value="40" class="param-number">
                            </div>
                        </div>
                        <button class="param-save-btn" id="paramSaveBtn" onclick="saveParamPreset()">保存预设</button>
                    </div>
                </div>

                <!-- RAG 知识库面板 -->
                <div class="rag-panel" id="ragPanel">
                    <button class="rag-toggle-btn" id="ragToggleBtn" onclick="toggleRagPanel()">
                        <span>📚 知识库 (RAG)</span>
                        <svg id="ragArrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div class="rag-body" id="ragBody" style="display:none;">
                        <div class="rag-upload-area" id="ragUploadArea">
                            <input type="file" id="ragFileInput" accept=".txt,.md,.pdf,.doc,.docx" style="display:none" onchange="uploadRagDocument(this)">
                            <button class="rag-upload-btn" onclick="document.getElementById('ragFileInput').click()">+ 上传文档</button>
                            <span class="rag-hint">支持 TXT, MD, PDF 格式</span>
                        </div>
                        <div class="rag-doc-list" id="ragDocList">
                            <!-- 文档列表将动态加载 -->
                        </div>
                        <label class="rag-enable-label">
                            <input type="checkbox" id="ragEnableCheckbox" onchange="toggleRagMode()">
                            <span>启用知识库增强</span>
                        </label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主聊天区域 -->
        <main class="chat-main">
            <!-- 消息容器 -->
            <div class="messages-container" id="messagesContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-content">
                        <h1>Spring AI Chat</h1>
                        <p>智能对话助手 - 支持离线模式、DeepSeek 和 OpenAI</p>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="输入消息..." 
                        rows="1"
                        maxlength="4000"></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="tip-text">按 Enter 发送，Shift + Enter 换行</span>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script th:src="@{/js/chat.js}"></script>
</body>
</html>
