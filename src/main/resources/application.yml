server:
  port: 8080

spring:
  profiles:
    active: deepseek,openai,h2  # 默认使用DeepSeek + H2数据库，可改为 ollama,h2 使用离线模式
  
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:7b-instruct
      embedding:
        model: nomic-embed-text  # RAG embedding 模型（需先 ollama pull nomic-embed-text）
    
    # OpenAI 配置（仅用于通用配置 ，实际 Base URL 、API Key 等在单独配置文件中指定）
    openai:
      rest-template:
        connect-timeout: 5000
        read-timeout: 10000

    # 阿里云百炼 DashScope 配置（图像生成：通义万相 wan2.6-t2i，通过 HTTP API 调用）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

  # JPA Configuration (通用配置)
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  # Multipart 文件上传配置（RAG 知识库）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings,loggers
  endpoint:
    health:
      show-details: when-authorized

# Chat Configuration
chat:
  max-context-messages: 10  # 保留最近10轮对话作为上下文

# RAG 配置
rag:
  embedding-model: ollama  # embedding 提供者: ollama（本地免费）或 openai（需有有效的API Key）
  store-type: memory       # 向量存储模式: memory（内存，测试/开发用，重启清空）或 pgvector（持久化，生产用，需postgresql profile）

# 存储配置（图像生成后的文件存储方式）
storage:
  type: local               # 存储类型：local（本地）/ oss（阿里云OSS）/ minio（MinIO）/ fastdfs（FastDFS）
  local:
    base-path: ./uploads     # 本地文件存储根目录
    access-path: /images     # 本地文件访问路径前缀
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY:}
    access-key-secret: ${OSS_SECRET:}
    bucket-name: ${OSS_BUCKET:}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET:}
    bucket-name: ${MINIO_BUCKET:ai-images}
  fastdfs:
    tracker-servers: ${FASTDFS_TRACKER:}
    web-server-url: ${FASTDFS_WEB_URL:}
