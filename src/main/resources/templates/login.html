<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - Spring AI Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            width: 400px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 32px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .auth-header p { color: #b0b0b0; font-size: 14px; }
        .tab-bar {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid #2a2a2a;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #b0b0b0;
            font-size: 16px;
            padding: 12px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #252525;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .captcha-row input { flex: 1; }
        .captcha-display {
            background: #252525;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 8px 14px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 4px;
            color: #667eea;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            min-width: 100px;
            text-align: center;
            transition: background 0.2s;
        }
        .captcha-display:hover { background: #333; }
        .captcha-hint { font-size: 11px; color: #666; margin-top: 4px; }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            background: rgba(239,68,68,0.15);
            color: #ef4444;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .success-msg {
            background: rgba(16,185,129,0.15);
            color: #10b981;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .password-hint {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Spring AI Chat</h1>
            <p>智能对话助手</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">登录</button>
            <button class="tab-btn" id="registerTab" onclick="switchTab('register')">注册</button>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <!-- 登录表单 -->
        <div id="loginPanel" class="panel active">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="captcha-row">
                    <input type="text" id="loginCaptcha" placeholder="请输入验证码" maxlength="5" autocomplete="off">
                    <div class="captcha-display" id="loginCaptchaDisplay" onclick="refreshCaptcha('login')" title="点击刷新">-----</div>
                </div>
                <div class="captcha-hint">点击图片可刷新验证码</div>
            </div>
            <button class="submit-btn" id="loginBtn" onclick="doLogin()">登录</button>
        </div>

        <!-- 注册表单 -->
        <div id="registerPanel" class="panel">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="请输入密码" autocomplete="new-password">
                <div class="password-hint">须包含大写字母、小写字母和数字，6-50位</div>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="regConfirmPassword" placeholder="请再次输入密码" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div class="captcha-row">
                    <input type="text" id="regCaptcha" placeholder="请输入验证码" maxlength="5" autocomplete="off">
                    <div class="captcha-display" id="regCaptchaDisplay" onclick="refreshCaptcha('register')" title="点击刷新">-----</div>
                </div>
                <div class="captcha-hint">点击图片可刷新验证码</div>
            </div>
            <button class="submit-btn" id="registerBtn" onclick="doRegister()">注册</button>
        </div>
    </div>

    <script>
        let rsaPublicKey = null;

        // 初始化：获取RSA公钥和验证码
        document.addEventListener('DOMContentLoaded', async () => {
            await loadPublicKey();
            await refreshCaptcha('login');
            await refreshCaptcha('register');
        });

        // 获取RSA公钥
        async function loadPublicKey() {
            try {
                const resp = await fetch('/api/auth/public-key');
                const data = await resp.json();
                rsaPublicKey = data.publicKey;
            } catch (e) {
                showError('加载加密密钥失败，请刷新页面');
            }
        }

        // RSA加密（使用Web Crypto API）
        async function rsaEncrypt(plainText) {
            const binaryDer = atob(rsaPublicKey);
            const derArray = new Uint8Array(binaryDer.length);
            for (let i = 0; i < binaryDer.length; i++) {
                derArray[i] = binaryDer.charCodeAt(i);
            }
            const cryptoKey = await crypto.subtle.importKey(
                'spki',
                derArray.buffer,
                { name: 'RSA-OAEP', hash: 'SHA-256' },
                false,
                ['encrypt']
            );
            const encoded = new TextEncoder().encode(plainText);
            const encrypted = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, cryptoKey, encoded);
            return btoa(String.fromCharCode(...new Uint8Array(encrypted)));
        }

        // 刷新验证码
        async function refreshCaptcha(tab) {
            try {
                const resp = await fetch('/api/auth/captcha');
                const data = await resp.json();
                const displayId = tab === 'login' ? 'loginCaptchaDisplay' : 'regCaptchaDisplay';
                document.getElementById(displayId).textContent = data.captcha;
            } catch (e) {
                console.error('加载验证码失败', e);
            }
        }

        // 切换Tab
        function switchTab(tab) {
            document.getElementById('loginTab').classList.toggle('active', tab === 'login');
            document.getElementById('registerTab').classList.toggle('active', tab === 'register');
            document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
            document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
            hideMessages();
        }

        // 登录
        async function doLogin() {
            hideMessages();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const captcha = document.getElementById('loginCaptcha').value.trim();

            if (!username || !password || !captcha) {
                showError('请填写所有字段');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;

            try {
                const encPassword = await rsaEncrypt(password);
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: encPassword, captcha })
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.message);
                    await refreshCaptcha('login');
                }
            } catch (e) {
                showError('登录失败，请重试');
                await refreshCaptcha('login');
            } finally {
                btn.disabled = false;
            }
        }

        // 注册
        async function doRegister() {
            hideMessages();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const captcha = document.getElementById('regCaptcha').value.trim();

            if (!username || !password || !confirmPassword || !captcha) {
                showError('请填写所有字段');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            const pwdPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,50}$/;
            if (!pwdPattern.test(password)) {
                showError('密码必须包含大写字母、小写字母和数字，长度6-50位');
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;

            try {
                const encPassword = await rsaEncrypt(password);
                const encConfirmPassword = await rsaEncrypt(confirmPassword);
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: encPassword, confirmPassword: encConfirmPassword, captcha })
                });
                const data = await resp.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.message);
                    await refreshCaptcha('register');
                }
            } catch (e) {
                showError('注册失败，请重试');
                await refreshCaptcha('register');
            } finally {
                btn.disabled = false;
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        // 回车键提交
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const loginActive = document.getElementById('loginPanel').classList.contains('active');
                if (loginActive) doLogin();
                else doRegister();
            }
        });
    </script>
</body>
</html>
